<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国风游戏殿堂</title>
    <style>
        /* 引入国风字体（如果没有，用默认也行） */
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at center, #1a1025 0%, #0d0812 100%);
            font-family: 'ZCOOL KuaiLe', 'Microsoft YaHei', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* 动态星空背景 */
        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffd700, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #ff4d4d, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #ffd700, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #ff4d4d, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #ffd700, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: starsMove 60s linear infinite;
            opacity: 0.6;
        }
        @keyframes starsMove { from { background-position: 0 0; } to { background-position: 200px 200px; } }

        /* 标题 */
        .title {
            font-size: 3.5rem;
            margin-bottom: 60px;
            text-align: center;
            background: linear-gradient(to bottom, #ffe6a0, #ffb300, #ff6600);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 179, 0, 0.4);
            letter-spacing: 5px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* 卡片容器 */
        .game-container {
            display: flex;
            gap: 50px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* 华丽游戏卡片 */
        .game-card {
            width: 300px;
            height: 400px;
            background: rgba(30, 20, 40, 0.6);
            border-radius: 25px;
            border: 2px solid rgba(255, 179, 0, 0.3);
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(255, 179, 0, 0.1);
        }

        /* 卡片发光动效 */
        .game-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(transparent, rgba(255, 179, 0, 0.8), transparent 30%);
            animation: rotate 4s linear infinite;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .game-card:hover::before { opacity: 1; }
        .game-card:hover {
            transform: translateY(-20px) scale(1.05);
            border-color: #ffd700;
            box-shadow: 0 20px 50px rgba(255, 179, 0, 0.4), inset 0 0 30px rgba(255, 179, 0, 0.3);
        }

        @keyframes rotate { 100% { transform: rotate(360deg); } }

        /* 卡片内容 */
        .game-icon {
            font-size: 80px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(255, 179, 0, 0.6));
            transition: transform 0.5s;
        }
        .game-card:hover .game-icon { transform: scale(1.2) rotate(5deg); }

        .game-name {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffe6a0;
            text-shadow: 0 0 10px rgba(255, 179, 0, 0.8);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .game-desc {
            font-size: 0.9rem;
            color: #bbaacc;
            text-align: center;
            padding: 0 20px;
            font-family: 'Microsoft YaHei', sans-serif;
            line-height: 1.5;
        }

        /* 游玩按钮 */
        .play-btn {
            margin-top: 25px;
            padding: 10px 30px;
            border-radius: 50px;
            background: linear-gradient(45deg, #ff6600, #ffb300);
            color: #1a1025;
            font-weight: bold;
            font-size: 1rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s;
        }
        .game-card:hover .play-btn { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>
    <div class="stars"></div>
    <h1 class="title">国风游戏殿堂</h1>

    <div class="game-container">
        <!-- 游戏1：十二生肖闯江湖 -->
        <a href="./zodiac/index.html" class="game-card">
            <div class="game-icon">🐉</div>
            <div class="game-name">十二生肖闯江湖</div>
            <div class="game-desc">集结十二生肖，勇闯武侠世界，问鼎武林之巅！</div>
            <div class="play-btn">立刻出发</div>
        </a>

        <!-- 游戏2：年兽大作战 -->
        <a href="./nian/index.html" class="game-card">
            <div class="game-icon">🧨</div>
            <div class="game-name">年兽大作战</div>
            <div class="game-desc">爆竹声中一岁除，击败年兽，守护人间太平！</div>
            <div class="play-btn">立刻迎战</div>
        </a>
    </div>
</body>
</html>
