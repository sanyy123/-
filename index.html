<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover：让背景铺到刘海屏的圆角里，内容位置由 env(safe-area-inset-*) 兜住 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0812">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="国风游戏殿堂 · 十二生肖闯江湖 / 年兽大作战">
<title>国风游戏殿堂</title>
<style>
/* ★ 先把 html 背景刷成深色。
   手机上"打开页面先闪一下白"通常就是因为背景色要等 body 的样式表生效才应用，
   在 html 上写死背景色，首帧就是深色，不会白闪。 */
html { background: #0d0812; }

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    /* 100vh 在手机上会被地址栏伸缩算错；100dvh 才是"当前真正可见的高度"。
       老浏览器不认 dvh，所以先写 vh 兜底再写 dvh 覆盖。 */
    min-height: 100vh;
    min-height: 100dvh;
    background: radial-gradient(circle at center, #1a1025 0%, #0d0812 100%);
    font-family: 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /* 安全区：刘海屏顶部、底部小白条、横屏时的左右圆角都不再压住内容 */
    padding: calc(env(safe-area-inset-top, 0px) + 18px)
             calc(env(safe-area-inset-right, 0px) + 14px)
             calc(env(safe-area-inset-bottom, 0px) + 22px)
             calc(env(safe-area-inset-left, 0px) + 14px);
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
}

.title {
    font-size: 1.9rem;
    margin-bottom: 22px;
    text-align: center;
    background: linear-gradient(to bottom, #ffe6a0, #ffb300, #ff6600);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 3px;
    line-height: 1.25;
}

.game-container {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 420px;
}

.game-card {
    width: 100%;
    padding: 16px 18px;
    background: rgba(30, 20, 40, 0.8);
    border-radius: 18px;
    border: 1px solid rgba(255, 179, 0, 0.4);
    text-decoration: none;
    color: white;
    /* ★ 手机端改成"横条"而不是"竖块"：
       原来一屏放不下两张卡，玩家要滚动才知道有第二个游戏。
       横条后两张卡 + 标题一屏刚好放得下。 */
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 14px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 179, 0, 0.1);
    transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
    /* 点击热区整块可点，且不会被系统当成文字选择 / 长按菜单 */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}

/* 用点击反馈代替悬浮动画（手机没有鼠标悬浮） */
.game-card:active {
    transform: scale(0.975);
    border-color: #ffd700;
    box-shadow: 0 4px 15px rgba(255, 179, 0, 0.3), inset 0 0 20px rgba(255, 179, 0, 0.2);
}

.game-icon { font-size: 38px; line-height: 1; flex-shrink: 0; }

.game-text { flex: 1; min-width: 0; }

.game-name {
    font-size: 1.15rem;
    font-weight: bold;
    color: #ffe6a0;
    text-shadow: 0 0 10px rgba(255, 179, 0, 0.6);
    margin-bottom: 4px;
    letter-spacing: 1px;
}

.game-desc {
    font-size: 0.76rem;
    color: #bbaacc;
    line-height: 1.45;
}

.play-btn {
    flex-shrink: 0;
    padding: 9px 16px;
    border-radius: 50px;
    background: linear-gradient(45deg, #ff6600, #ffb300);
    color: #1a1025;
    font-weight: bold;
    font-size: 0.82rem;
    white-space: nowrap;
}

/* ===== 进入游戏的过渡页 =====
   手机上点卡片后，浏览器要等新页面首字节回来才切画面，中间那 1~3 秒
   是一片纯黑 —— 玩家会以为"点了没反应"。现在点击瞬间先盖上这一层，
   把"正在加载"变成看得见的状态。 */
.enter-splash {
    position: fixed;
    inset: 0;
    z-index: 99;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: #0d0812;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease;
    padding: 24px;
    text-align: center;
}
.enter-splash.show { opacity: 1; pointer-events: auto; }
.enter-splash .spinner {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 3px solid rgba(255, 179, 0, 0.22);
    border-top-color: #ffb300;
    animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.enter-splash .enter-text { font-size: 0.95rem; color: #ffe6a0; letter-spacing: 1px; }
.enter-splash .enter-tip { font-size: 0.75rem; color: #7a6b8a; line-height: 1.6; }
@media (prefers-reduced-motion: reduce) {
    .enter-splash .spinner { animation: none; }
}

/* ===== 平板 / 电脑 ===== */
@media (min-width: 768px) {
    .title { font-size: 3.2rem; margin-bottom: 50px; }
    /* ★ 三张卡横排至少需要 3×320 + 2×36 = 1032px。
       容器上限只给 820px 的话，flex 会把卡片压瘦：768px 下实测只剩 222.7px，
       「十二生肖闯江湖」被折成「十二生肖闯江 / 湖」，末尾孤零零一个字。
       所以上限提到 1080px，再加 flex-wrap 兜底 —— 宽度不够时是**换行**
       而不是把卡片挤变形（以后加第四个入口也不会重演这个坑）。 */
    .game-container {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 1080px;
        gap: 36px;
        align-items: stretch;
    }
    .game-card {
        flex-direction: column;
        width: 320px;
        padding: 30px 24px;
        gap: 0;
        text-align: center;
    }
    .game-icon { font-size: 76px; margin-bottom: 16px; }
    .game-name { font-size: 1.5rem; margin-bottom: 8px; }
    .game-desc { font-size: 0.85rem; }
    .play-btn { margin-top: 22px; padding: 11px 34px; font-size: 1rem; }
    .game-card:hover {
        transform: translateY(-10px) scale(1.03);
        border-color: #ffd700;
        box-shadow: 0 15px 40px rgba(255, 179, 0, 0.4);
    }
}
</style>
</head>
<body>
    <h1 class="title">国风游戏殿堂</h1>

    <div class="game-container">
        <a href="./zodiac/index.html" class="game-card" data-name="十二生肖闯江湖">
            <div class="game-icon">🐉</div>
            <div class="game-text">
                <div class="game-name">十二生肖闯江湖</div>
                <div class="game-desc">集结十二生肖，勇闯武侠世界，问鼎武林之巅！</div>
            </div>
            <div class="play-btn">出发</div>
        </a>

        <a href="./nian/index.html" class="game-card" data-name="棋盘枪手">
            <div class="game-icon">🧨</div>
            <div class="game-text">
                <div class="game-name">棋盘枪手</div>
                <div class="game-desc">被钉在场地中央，四面楚歌 —— 你能撑多久？</div>
            </div>
            <div class="play-btn">迎战</div>
        </a>

        <a href="./tiled-farm-guide/index.html" class="game-card" data-name="Tiled 地图指南">
            <div class="game-icon">🗺️</div>
            <div class="game-text">
                <div class="game-name">Tiled 地图指南</div>
                <div class="game-desc">从零做出一张星露谷式农场地图：七步工作流、图层规划与避坑清单。</div>
            </div>
            <div class="play-btn">阅读</div>
        </a>
    </div>

    <div class="enter-splash" id="enterSplash" aria-hidden="true">
        <div class="spinner"></div>
        <div class="enter-text" id="enterText">正在进入…</div>
        <div class="enter-tip">首次进入需要下载游戏资源<br>之后会快很多</div>
    </div>

<script>
(function () {
    'use strict';

    /* ===== 1. 预取游戏入口 =====
       卡片被按下时就去取目标页面的 HTML（很小，几 KB），
       等玩家真正松手跳转时，文档往往已经躺在 HTTP 缓存里了。
       只预取 HTML，不碰游戏的大资源 —— 免得和当前页面抢带宽。 */
    var prefetched = {};
    function prefetch(href) {
        if (!href || prefetched[href]) return;
        prefetched[href] = 1;
        try {
            var link = document.createElement('link');
            link.rel = 'prefetch';
            link.href = href;
            document.head.appendChild(link);
        } catch (e) { /* 预取失败完全不影响正常跳转 */ }
    }

    /* ===== 2. 点击 → 立刻盖过渡页 → 再跳转 =====
       不这样做的话，点击到新页面首字节回来之间是一片纯黑，
       玩家会以为"点了没反应"而反复点。 */
    var splash = document.getElementById('enterSplash');
    var enterText = document.getElementById('enterText');

    Array.prototype.forEach.call(document.querySelectorAll('.game-card'), function (card) {
        var href = card.getAttribute('href');
        var name = card.getAttribute('data-name') || '游戏';

        card.addEventListener('pointerdown', function () { prefetch(href); }, { passive: true });
        card.addEventListener('touchstart', function () { prefetch(href); }, { passive: true });
        card.addEventListener('mouseenter', function () { prefetch(href); });

        card.addEventListener('click', function (e) {
            // 新窗口 / 新标签打开时不接管，交给浏览器默认行为
            if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button === 1) return;
            e.preventDefault();
            enterText.textContent = '正在进入「' + name + '」…';
            splash.classList.add('show');
            // 等两帧把过渡页真正画到屏幕上再跳转。
            // 只等一帧的话，部分手机上导航会抢先执行，过渡页根本没机会显示。
            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    window.location.href = href;
                });
            });
        });
    });

    // 从游戏页返回（浏览器前进后退恢复）时把过渡页收掉，
    // 否则会出现"回来了但一直卡在正在进入…"。
    window.addEventListener('pageshow', function (e) {
        if (e.persisted) splash.classList.remove('show');
    });

    /* ===== 3. 页面空闲后，把各个入口都预取一遍 =====
       玩家在首页停留的这几秒，正好用来把游戏页 / 指南页的 HTML 拉到本地。 */
    function warmAll() {
        prefetch('./zodiac/index.html');
        prefetch('./nian/index.html');
        prefetch('./tiled-farm-guide/index.html');
    }
    if (typeof requestIdleCallback === 'function') {
        requestIdleCallback(warmAll, { timeout: 2000 });
    } else {
        setTimeout(warmAll, 800);
    }

    /* ===== 4. 注册合集页的 Service Worker =====
       只缓存"合集页自己的 HTML"，让第二次打开首页是本地直出、几乎瞬开。
       游戏页有各自的 SW，这里一概不插手（非首页请求直接放行）。
       注册失败（隐私模式 / 非 HTTPS / file:// 双击打开）完全不影响任何功能。 */
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register('sw.js').catch(function () {});
        });
    }
})();
</script>
</body>
</html>
