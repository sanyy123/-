<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover 让画布能铺到刘海屏的圆角里；safe-area 由下面的 CSS 处理 -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="棋盘枪手 —— 斜俯视四方向自动射击小游戏">
<title>棋盘枪手 · Board Shooter</title>
<!-- 提前和 CDN 建连：phaser.min.js 是首屏最大的一块，握手能省一个 RTT -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-root"></div>
<div id="boot-splash">
  <div class="ring"></div>
  <div class="txt" id="boot-text">正在加载引擎…</div>
</div>
<div id="rotate-hint">
  <div class="phone"></div>
  <div>
    <div class="t1">请把手机横过来</div>
    <div class="t2">棋盘枪手是横屏游戏<br>竖着拿会被压成中间一条</div>
  </div>
  <button id="rotate-skip" type="button">就这样玩</button>
</div>
<script>
/* 竖屏提示 / 启动页的开关。这段刻意不依赖 Phaser ——
   引擎还没下载完的时候玩家就该看到"请横屏"，而不是先黑屏再横屏 */
(function () {
  var hint = document.getElementById('rotate-hint');
  var skipBtn = document.getElementById('rotate-skip');
  var skipped = false;

  // 只在"竖屏 + 触摸设备"时提示。桌面上把窗口拉窄不该弹这个
  function portrait() {
    try {
      return window.matchMedia('(orientation: portrait) and (pointer: coarse)').matches;
    } catch (e) {
      return false;
    }
  }
  function apply() {
    var need = portrait() && !skipped;
    document.body.classList.toggle('need-rotate', need);
    if (need) {
      // 转屏期间玩家看不见画面，不暂停的话回来已经死了
      try {
        if (window.__game && window.__game.events) {
          window.__game.events.emit('blur');
        }
      } catch (e) { /* 引擎还没起来就算了 */ }
    }
  }
  skipBtn.addEventListener('click', function () { skipped = true; apply(); });
  window.addEventListener('resize', apply);
  window.addEventListener('orientationchange', function () { setTimeout(apply, 120); });
  apply();
  window.__applyRotateHint = apply;
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<!-- 主脚本：拆成 src/ 下 10 个文件，按序号顺序加载。
     顺序不能调换 —— 顶层全是 const / class，有 TDZ，顺序错了直接 ReferenceError。
     用经典 script 标签而不是 ES module：file:// 下 module 会被 CORS 拦，那样就不能双击直接玩了。 -->
<script src="src/01-boot.js"></script>
<script src="src/02-config.js"></script>
<script src="src/03-atlas.js"></script>
<script src="src/04-data.js"></script>
<script src="src/05-core.js"></script>
<script src="src/06-art.js"></script>
<script src="src/07-guide.js"></script>
<script src="src/08-menu.js"></script>
<script src="src/09-game.js"></script>
<script src="src/10-main.js"></script>
</body>
</html>
