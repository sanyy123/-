/* ============================================================================
   主菜单
   ============================================================================ */
class MenuScene extends Phaser.Scene {
  constructor() { super('Menu'); }

  /* 主菜单要摆角色和敌人的立绘，所以图集得在这里就加载好。
     以前只有 GameScene 有 preload，于是菜单上的敌人一直显示成几个程序化圆球。
     后面几个场景的 preload 会再调一次，但纹理已在缓存里，会被直接跳过 */
  preload() {
    loadEnemySheets(this);
    loadCharSheets(this);
    loadFxSheets(this);
  }

  create() {
    Textures.ensure(this);
    const W = CONFIG.width, H = CONFIG.height;
    SoundSys.setMuted(Storage.readMute());

    const bg = this.add.graphics().setDepth(-100);
    bg.fillStyle(0x060b12, 1);
    bg.fillRect(0, 0, W, H);
    bg.fillStyle(0x101c2a, 1); bg.fillCircle(W/2, H/2 - 50, 480);
    bg.fillStyle(0x16263a, 1); bg.fillCircle(W/2, H/2 - 50, 340);
    bg.fillStyle(0x1d304a, 1); bg.fillCircle(W/2, H/2 - 50, 220);

    this.drawDecoBoard();
    this.drawDecoDots();

    const title = this.add.text(W/2, 126, '棋 盘 枪 手', {
      fontFamily: UI.FONT, fontSize: '78px', color: '#ffe066', fontStyle: 'bold',
    }).setOrigin(0.5);
    title.setShadow(0, 8, '#000000', 16, true, true);

    this.add.text(W/2, 198, 'B O A R D   S H O O T E R', {
      fontFamily: UI.MONO, fontSize: '16px', color: '#8fa3b8', letterSpacing: 8,
    }).setOrigin(0.5);

    this.drawCenterShowcase();

    this.add.text(W/2, 402, '你被钉在场地中央，四面楚歌 —— 能撑多久？', {
      fontFamily: UI.FONT, fontSize: '18px', color: '#8fa3b8',
    }).setOrigin(0.5);

    // 当前整备状态直接摆在主菜单上，省得每次都要点进装备界面确认自己带的是什么
    const load = Storage.readLoadout();
    const charDef = CHARACTERS[load.character] || CHARACTERS.gunner;
    const weaponDef = WEAPONS[load.weapon] || WEAPONS.pistol;
    const skillNames = load.skills
      .filter(k => k && SKILLS[k])
      .map(k => SKILLS[k].name)
      .join(' / ') || '无';
    this.add.text(W/2, 432, '当前：' + charDef.name + ' · ' + weaponDef.name + ' · 技能 ' + skillNames, {
      fontFamily: UI.FONT, fontSize: '14px', color: '#7fffa0',
    }).setOrigin(0.5);

    this.add.text(W/2, 464, '金币  ' + Storage.readCoins(), {
      fontFamily: UI.MONO, fontSize: '19px', color: '#ffd54a', fontStyle: 'bold',
    }).setOrigin(0.5);

    // 五个按钮排一行：无限 / 肉鸽 / 商城 / 装备 / 指南。
    // 从四个变五个，单按钮宽度要从 190 收到 168 才排得下（5×168 + 4×16 = 904 < 960）
    const btnY = H - 76;
    const bw = 168, gap = 16;
    const total = 5 * bw + 4 * gap;
    const first = (W - total) / 2 + bw / 2;

    UI.makeButton(this, first + 0 * (bw + gap), btnY, bw, 64, '无 限 模 式',
      0x4a90d9, 0x5fa8f0, () => { this.scene.start('Game'); }, '19px');
    UI.makeButton(this, first + 1 * (bw + gap), btnY, bw, 64, '肉 鸽 模 式',
      0xa8392f, 0xd95a4a, () => { this.scene.start('Game', { mode: 'rogue' }); }, '19px');
    UI.makeButton(this, first + 2 * (bw + gap), btnY, bw, 64, '商 城',
      0x8b6a3f, 0xb08a55, () => { this.scene.start('Shop'); }, '19px');
    UI.makeButton(this, first + 3 * (bw + gap), btnY, bw, 64, '装 备',
      0x2a6b94, 0x4ac2ff, () => { this.scene.start('Loadout'); }, '19px');
    UI.makeButton(this, first + 4 * (bw + gap), btnY, bw, 64, '指 南',
      0x3a5230, 0x577346, () => { this.showGuide(); }, '19px');

    UI.makeButton(this, 100, 40, 140, 48, '历 史 战 绩', 0x3a5230, 0x577346, () => {
      this.showHistory();
    }, '17px');

    this.guideOpen = false;
    this.input.keyboard.on('keydown-SPACE', () => { if (!this.guideOpen) this.scene.start('Game'); });
    this.input.keyboard.on('keydown-ENTER', () => { if (!this.guideOpen) this.scene.start('Game'); });

    this.buildGuide();
  }

  drawDecoBoard() {
    const g = this.add.graphics().setDepth(-50);
    const cell = 28, cols = 5, rows = 4;
    const startX = CONFIG.width - cols * cell - 40;
    const startY = 40;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        g.fillStyle(0x4a90d9, ((r + c) % 2 === 0) ? 0.10 : 0.03);
        g.fillRect(startX + c * cell, startY + r * cell, cell - 2, cell - 2);
      }
    }
  }

  drawDecoDots() {
    const g = this.add.graphics().setDepth(-50);
    g.fillStyle(0xd94a4a, 0.18);
    for (let i = 0; i < 8; i++) g.fillCircle(80 + i * 22, CONFIG.height - 60, 6);
  }

  drawCenterShowcase() {
    const cx = CONFIG.width / 2, cy = 300;
    // 展示当前装备的角色，换角色后主菜单立刻能看出区别
    const load = Storage.readLoadout();
    const ch = CHARACTERS[load.character] || CHARACTERS.gunner;
    const base = CharArt.fit(this, ch, 1.3);
    const player = CharArt.add(this, cx, cy, ch);
    // 呼吸幅度按立绘大小算：写死 ±0.05 的话，2.6 倍的大立绘上几乎看不出在动
    this.tweens.add({
      targets: player, scale: { from: base * 0.96, to: base * 1.04 },
      duration: 1200, yoyo: true, repeat: -1, ease: 'Sine.easeInOut',
    });
    // 四个敌人立绘。以前这里用的是 enemy-<兵种>-<朝向> 程序化纹理，
    // 所以菜单上一直显示成几个彩色圆球；改成取图集里对应朝向的第一帧，
    // 和游戏里看到的是同一批精灵
    this.addEnemyPortrait(cx - 90, cy - 50, 'infantry', 'right');
    this.addEnemyPortrait(cx + 90, cy - 50, 'rusher', 'left');
    this.addEnemyPortrait(cx - 110, cy + 50, 'shotgunner', 'up');
    this.addEnemyPortrait(cx + 110, cy + 50, 'armored', 'down');
  }

  /* 敌人立绘：取图集里该方向的第一帧。
     缩放用兵种自己的 sheetScale 再乘 1.15 —— 铁甲兵在游戏里就比步兵大一圈，
     菜单里保持同样的比例，玩家一眼就能看出"这个更壮"；
     多出来的 15% 是因为图集帧里角色本体的占比比程序化纹理小，
     照抄游戏内缩放会让立绘比原来那几个圆球小一截。
     图集没加载成功时退回程序化纹理，和游戏里用的是同一套降级策略 */
  addEnemyPortrait(x, y, typeKey, dir) {
    const def = ENEMY_TYPES[typeKey];
    const sheet = (def && def.sheet && this.textures.exists(def.sheet)) ? def.sheet : null;
    const d = dir || 'down';

    let img;
    let scale;
    if (sheet) {
      // 帧号 = 行号 × 每向帧数。行序固定是 下 / 上 / 左 / 右，
      // 每向帧数不能写死 8 —— 追踪炮和爆裂兵每向只有 6 帧
      const step = SHEET_FRAMES_PER_DIR[sheet] || 8;
      const row = { down: 0, up: 1, left: 2, right: 3 }[d] || 0;
      img = this.add.image(x, y, sheet, row * step);
      scale = (def.sheetScale != null ? def.sheetScale : CONFIG.sheetScale) * 1.15;
    } else {
      img = this.add.image(x, y, 'enemy-' + typeKey + '-' + d);
      scale = 1.05;
    }

    img.setScale(scale).setAlpha(0.9);
    return img;
  }

  /* ======================= 指南 ======================= */

  buildGuide() {
    const W = CONFIG.width, H = CONFIG.height;
    this.guideContainer = this.add.container(0, 0).setDepth(10000).setVisible(false);

    const mask = this.add.rectangle(0, 0, W, H, 0x060b12, 0.92).setOrigin(0, 0);
    mask.setInteractive();
    this.guideContainer.add(mask);

    const panelW = 880, panelH = 520;
    const px = (W - panelW) / 2, py = (H - panelH) / 2;

    const panel = this.add.graphics();
    panel.fillStyle(0x152130, 1);
    panel.fillRoundedRect(px, py, panelW, panelH, 20);
    panel.lineStyle(3, 0x8b6a3f, 0.8);
    panel.strokeRoundedRect(px, py, panelW, panelH, 20);
    this.guideContainer.add(panel);

    const divider = this.add.graphics();
    divider.lineStyle(1.5, 0x33404f, 1);
    divider.lineBetween(px + 190, py + 70, px + 190, py + panelH - 20);
    this.guideContainer.add(divider);

    const title = this.add.text(px + 30, py + 28, '游 戏 指 南', {
      fontFamily: UI.FONT, fontSize: '22px', color: '#ffe066', fontStyle: 'bold',
    }).setOrigin(0, 0);
    this.guideContainer.add(title);

    const closeBtn = this.add.text(px + panelW - 32, py + 32, '✕', {
      fontFamily: UI.FONT, fontSize: '24px', color: '#8fa3b8', fontStyle: 'bold',
    }).setOrigin(0.5);
    closeBtn.setInteractive({ useHandCursor: true });
    closeBtn.on('pointerover', () => closeBtn.setColor('#ffffff'));
    closeBtn.on('pointerout',  () => closeBtn.setColor('#8fa3b8'));
    closeBtn.on('pointerdown', () => { SoundSys.unlock(); SoundSys.uiClick(); this.hideGuide(); });
    this.guideContainer.add(closeBtn);

    this.guideContentLayer = this.add.container(0, 0);
    this.guideContainer.add(this.guideContentLayer);

    // 内容区域：使用遮罩实现滚动
    this.guideContentX = px + 210;
    this.guideContentY = py + 80;
    this.guideContentW = panelW - 240;
    this.guideContentH = panelH - 110;

    this.scrollContainer = this.add.container(this.guideContentX, this.guideContentY);
    this.guideContentLayer.add(this.scrollContainer);

        // 遮罩图形（不可见，只用于裁剪）
        const maskShape = this.make.graphics();
        maskShape.fillRect(this.guideContentX, this.guideContentY, this.guideContentW, this.guideContentH);
        const contentMask = maskShape.createGeometryMask(); // <--- 改名
        this.scrollContainer.setMask(contentMask);           // <--- 改名

    // 滚动状态
    this.scrollY = 0;
    this.maxScrollY = 0;
    this.isDragging = false;
    this.dragStartY = 0;
    this.dragStartScrollY = 0;

    // 拖动区域（覆盖整个内容区域，拦截交互）
    const dragArea = this.add.rectangle(
      this.guideContentX + this.guideContentW / 2,
      this.guideContentY + this.guideContentH / 2,
      this.guideContentW, this.guideContentH, 0x000000, 0
    ).setInteractive();
    this.guideContentLayer.add(dragArea);

    dragArea.on('pointerdown', (pointer) => {
      if (!this.guideOpen) return;
      this.isDragging = true;
      this.dragStartY = pointer.y;
      this.dragStartScrollY = this.scrollY;
    });

    this.input.on('pointermove', (pointer) => {
      if (!this.isDragging || !this.guideOpen) return;
      const dy = pointer.y - this.dragStartY;
      this.scrollY = this.dragStartScrollY - dy;
      this.clampGuideScroll();
    });

    this.input.on('pointerup', () => {
      this.isDragging = false;
    });

    // 鼠标滚轮支持
    this.input.on('wheel', (pointer, gameObjects, deltaX, deltaY) => {
      if (!this.guideOpen) return;
      this.scrollY += deltaY * 0.5;
      this.clampGuideScroll();
    });

    const tabDefs = [
      { key: 'controls',   label: '操作' },
      { key: 'combat',     label: '战斗' },
      { key: 'enemies',    label: '敌人' },
      { key: 'powerups',   label: '道具' },
      { key: 'combo',      label: '连击' },
      { key: 'difficulty', label: '难度' },
      { key: 'rogue',      label: '肉鸽' },
      { key: 'growth',     label: '成长' },
      { key: 'feedback',   label: '反馈' },
      { key: 'tips',       label: '技巧' },
    ];

    this.guideTabs = {};
    // 10 个标签要塞进 520 高的面板里：行高 38 → 36、间距保持 4，
    // 这样最后一个标签底边落在 py+480，离面板底还有 40px。
    // 行高回到 38 的话底边会到 500，只剩 20px，看着就贴边了
    const tabX = px + 30, tabW = 140, tabH = 36, tabStartY = py + 84, tabGap = 4;

    tabDefs.forEach((tab, i) => {
      const tx = tabX + tabW / 2;
      const ty = tabStartY + i * (tabH + tabGap) + tabH / 2;
      const tabObj = this.makeGuideTab(tx, ty, tabW, tabH, tab.label, () => {
        this.selectGuideTab(tab.key);
      });
      this.guideTabs[tab.key] = tabObj;
      this.guideContainer.add(tabObj.container);
    });

    this.selectGuideTab('controls');
  }

  clampGuideScroll() {
    // 内容高度 = 当前 scrollContainer 的内部高度（通过实际渲染内容计算）
    // 我们无法直接获取 Container 的内容高度，因此用 maxScrollY 来控制。
    // maxScrollY 在 renderGuideContent 中根据 ly 计算并设置。
    this.scrollY = Phaser.Math.Clamp(this.scrollY, 0, Math.max(0, this.maxScrollY));
    this.scrollContainer.y = this.guideContentY - this.scrollY;
  }

  makeGuideTab(cx, cy, w, h, label, onClick) {
    const container = this.add.container(cx, cy);
    const g = this.add.graphics();
    const text = this.add.text(0, 0, label, {
      fontFamily: UI.FONT, fontSize: '16px', color: '#8fa3b8', fontStyle: 'bold',
    }).setOrigin(0.5);
    container.add([g, text]);

    const self = {
      container, g, text,
      _active: false,
      setActive: (active) => {
        self._active = active;
        g.clear();
        if (active) {
          g.fillStyle(0x4a90d9, 1);
          g.fillRoundedRect(-w/2, -h/2, w, h, 10);
          g.fillStyle(0xffffff, 0.22);
          g.fillRoundedRect(-w/2 + 3, -h/2 + 3, w - 6, h/2 - 5, 8);
          g.lineStyle(2, 0xffffff, 0.7);
          g.strokeRoundedRect(-w/2, -h/2, w, h, 10);
          text.setColor('#ffffff');
        } else {
          g.fillStyle(0x0b1520, 0.6);
          g.fillRoundedRect(-w/2, -h/2, w, h, 10);
          g.lineStyle(1.5, 0x33404f, 1);
          g.strokeRoundedRect(-w/2, -h/2, w, h, 10);
          text.setColor('#8fa3b8');
        }
      },
      setHover: (hovered) => {
        if (self._active) return;
        text.setColor(hovered ? '#ffffff' : '#8fa3b8');
      },
    };

    const hit = this.add.rectangle(0, 0, w, h, 0x000000, 0);
    hit.setInteractive({ useHandCursor: true });
    hit.on('pointerover', () => self.setHover(true));
    hit.on('pointerout',  () => self.setHover(false));
    hit.on('pointerdown', () => { SoundSys.unlock(); SoundSys.uiClick(); onClick(); });
    container.add(hit);

    return self;
  }

  selectGuideTab(key) {
    for (const k in this.guideTabs) this.guideTabs[k].setActive(k === key);
    this.scrollContainer.removeAll(true);
    this.scrollY = 0;
    this.scrollContainer.y = this.guideContentY;
    const data = GUIDE_DATA[key];
    if (data) this.renderGuideContent(data);
  }

  renderGuideContent(data) {
    const x = 0; // 相对于 scrollContainer 的局部坐标
    const y = 0;
    const w = this.guideContentW;

    const title = this.add.text(x, y, data.title, {
      fontFamily: UI.FONT, fontSize: '20px', color: '#ffe066', fontStyle: 'bold',
    }).setOrigin(0, 0);
    this.scrollContainer.add(title);

    const sep = this.add.graphics();
    sep.lineStyle(1.5, 0x4a90d9, 0.5);
    sep.lineBetween(x, y + 34, x + w, y + 34);
    this.scrollContainer.add(sep);

    let ly = y + 52;

    for (const [k, v] of data.lines) {
      if (k === '') { ly += 10; continue; }

      if (k.startsWith('# ')) {
        const st = this.add.text(x, ly, k.substring(2), {
          fontFamily: UI.FONT, fontSize: '14px', color: '#7fffa0', fontStyle: 'bold',
        }).setOrigin(0, 0);
        this.scrollContainer.add(st);
        ly += 26;
        continue;
      }

      const keyText = this.add.text(x, ly, k, {
        fontFamily: UI.FONT, fontSize: '13px', color: '#a9bdd0',
      }).setOrigin(0, 0);
      const valText = this.add.text(x + 130, ly, v, {
        fontFamily: UI.FONT, fontSize: '13px', color: '#e0e8f0',
        wordWrap: { width: w - 140, useAdvancedWrap: true },
      }).setOrigin(0, 0);

      this.scrollContainer.add([keyText, valText]);
      ly += 22;
    }

    // 计算最大滚动距离
    // ly 是内容的底部 y 坐标（相对于 scrollContainer 局部坐标）
    // 可视高度是 this.guideContentH
    this.maxScrollY = Math.max(0, ly - this.guideContentH + 20);
    this.clampGuideScroll();
  }

  showGuide() { this.guideOpen = true; this.guideContainer.setVisible(true); }
  hideGuide() { this.guideOpen = false; this.guideContainer.setVisible(false); }

  /* ======================= 历史战绩 ======================= */

  showHistory() {
    if (this.historyPanel) return;

    const W = CONFIG.width, H = CONFIG.height;
    const list = Storage.readHistory();

    this.historyPanel = this.add.container(0, 0).setDepth(10100);

    const mask = this.add.rectangle(0, 0, W, H, 0x060b12, 0.9).setOrigin(0, 0);
    mask.setInteractive();
    this.historyPanel.add(mask);

    const panelW = 460, panelH = 420;
    const px = (W - panelW) / 2, py = (H - panelH) / 2;

    const panel = this.add.graphics();
    panel.fillStyle(0x152130, 1);
    panel.fillRoundedRect(px, py, panelW, panelH, 20);
    panel.lineStyle(3, 0x4a90d9, 0.7);
    panel.strokeRoundedRect(px, py, panelW, panelH, 20);
    this.historyPanel.add(panel);

    const title = this.add.text(W/2, py + 40, '历 史 战 绩', {
      fontFamily: UI.FONT, fontSize: '26px', color: '#ffe066', fontStyle: 'bold',
    }).setOrigin(0.5);
    this.historyPanel.add(title);

    const sub = this.add.text(W/2, py + 72, '最近 ' + Storage.HISTORY_MAX + ' 局', {
      fontFamily: UI.FONT, fontSize: '13px', color: '#8fa3b8',
    }).setOrigin(0.5);
    this.historyPanel.add(sub);

    if (list.length === 0) {
      const empty = this.add.text(W/2, py + panelH/2, '还没有记录，快去玩一局吧！', {
        fontFamily: UI.FONT, fontSize: '16px', color: '#55697d',
      }).setOrigin(0.5);
      this.historyPanel.add(empty);
    } else {
      list.forEach((entry, i) => {
        const y = py + 110 + i * 52;

        const bg = this.add.graphics();
        bg.fillStyle(0x0b1520, 0.6);
        bg.fillRoundedRect(px + 30, y - 18, panelW - 60, 42, 10);
        this.historyPanel.add(bg);

        const rank = this.add.text(px + 50, y, '#' + (i + 1), {
          fontFamily: UI.MONO, fontSize: '16px', color: '#8fa3b8',
        }).setOrigin(0, 0.5);
        this.historyPanel.add(rank);

        const score = this.add.text(px + 110, y, '得分 ' + entry.score, {
          fontFamily: UI.FONT, fontSize: '16px', color: '#ffe066', fontStyle: 'bold',
        }).setOrigin(0, 0.5);
        this.historyPanel.add(score);

        const diffLabel = entry.difficulty >= CONFIG.maxDifficulty + 1
          ? '难度 MAX'
          : '难度 ' + entry.difficulty;
        const diff = this.add.text(px + panelW - 50, y, diffLabel, {
          fontFamily: UI.FONT, fontSize: '14px', color: '#7fffa0',
        }).setOrigin(1, 0.5);
        this.historyPanel.add(diff);
      });
    }

    const closeBtn = UI.makeButton(this, W/2, py + panelH + 40, 240, 68, '关 闭', 0x5d452a, 0x8b6a3f, () => {
      this.historyPanel.destroy();
      this.historyPanel = null;
    });
    this.historyPanel.add(closeBtn);
  }
}

/* ============================================================================
   商城 —— 只负责"买"
   ----------------------------------------------------------------------------
   三个页签（角色 / 武器 / 技能）共用同一套卡片渲染，靠 SHOP_CATEGORIES 分派数据表。
   已拥有的东西在这里显示为"已拥有"，装备请到 LoadoutScene。
   ============================================================================ */
class ShopScene extends Phaser.Scene {
  constructor() { super('Shop'); }

  /* 角色卡片要摆立绘，图集不加载的话巫女 / 勇者会退回程序化圆球 */
  preload() {
    loadCharSheets(this);
    loadFxSheets(this);
  }

  create() {
    Textures.ensure(this);
    SoundSys.setMuted(Storage.readMute());

    this.loadout = Storage.readLoadout();
    this.tab = 'character';

    const W = CONFIG.width, H = CONFIG.height;

    const bg = this.add.graphics().setDepth(-100);
    bg.fillStyle(0x060b12, 1);
    bg.fillRect(0, 0, W, H);
    bg.fillStyle(0x101c2a, 1); bg.fillCircle(W/2, H/2 - 40, 520);
    bg.fillStyle(0x16263a, 1); bg.fillCircle(W/2, H/2 - 40, 380);

    this.add.text(40, 32, '商 城', {
      fontFamily: UI.FONT, fontSize: '30px', color: '#ffe066', fontStyle: 'bold',
    }).setOrigin(0, 0);

    this.add.text(42, 74, 'S H O P', {
      fontFamily: UI.MONO, fontSize: '12px', color: '#55697d', letterSpacing: 6,
    }).setOrigin(0, 0);

    this.coinText = this.add.text(W - 40, 48, '', {
      fontFamily: UI.MONO, fontSize: '26px', color: '#ffd54a', fontStyle: 'bold',
    }).setOrigin(1, 0.5);

    this.buildTabs();

    // 顶部提示：说清楚"这里只负责买"，以及钱从哪来
    this.add.text(W / 2, 142, '金币来自击杀敌人（普通 1 / 特殊 2） · 买完请到「装备」界面装上', {
      fontFamily: UI.FONT, fontSize: '14px', color: '#7fffa0',
    }).setOrigin(0.5);

    this.contentLayer = this.add.container(0, 0);

    UI.makeButton(this, W / 2 - 140, H - 46, 220, 56, '返 回 主 菜 单', 0x5d452a, 0x8b6a3f, () => {
      this.scene.start('Menu');
    }, '19px');
    UI.makeButton(this, W / 2 + 140, H - 46, 220, 56, '去 装 备', 0x2a6b94, 0x4ac2ff, () => {
      this.scene.start('Loadout');
    }, '19px');

    this.input.keyboard.on('keydown-ESC', () => this.scene.start('Menu'));

    this.refresh();
  }

  buildTabs() {
    const W = CONFIG.width;
    const defs = [
      { key: 'character', label: '角 色' },
      { key: 'weapon',    label: '武 器' },
      { key: 'skill',     label: '技 能' },
    ];

    this.tabButtons = {};
    const w = 170, h = 44, y = 102;

    defs.forEach((d, i) => {
      const x = W / 2 + (i - 1) * 190;
      const c = this.add.container(x, y);
      const g = this.add.graphics();
      const t = this.add.text(0, 0, d.label, {
        fontFamily: UI.FONT, fontSize: '18px', color: '#8fa3b8', fontStyle: 'bold',
      }).setOrigin(0.5);
      c.add([g, t]);

      const self = {
        draw: (active, hovered) => {
          g.clear();
          g.fillStyle(active ? 0x4a90d9 : (hovered ? 0x1d304a : 0x0b1520), active ? 1 : 0.85);
          g.fillRoundedRect(-w/2, -h/2, w, h, 12);
          g.lineStyle(2, active ? 0xffffff : 0x33404f, active ? 0.8 : 1);
          g.strokeRoundedRect(-w/2, -h/2, w, h, 12);
          t.setColor(active ? '#ffffff' : '#8fa3b8');
        },
      };
      this.tabButtons[d.key] = self;

      const hit = this.add.rectangle(0, 0, w, h, 0x000000, 0).setInteractive({ useHandCursor: true });
      hit.on('pointerover', () => { if (this.tab !== d.key) self.draw(false, true); });
      hit.on('pointerout',  () => { if (this.tab !== d.key) self.draw(false, false); });
      hit.on('pointerdown', () => {
        SoundSys.unlock(); SoundSys.uiClick();
        this.tab = d.key;
        this.refresh();
      });
      c.add(hit);
    });
  }

  /* 整个界面只有这一个重绘入口：买完就调它，
     避免出现"卡片状态更新了但顶部金币没更新"这类局部刷新漏掉的地方 */
  refresh() {
    this.coinText.setText('金币  ' + Storage.readCoins());

    for (const k in this.tabButtons) this.tabButtons[k].draw(k === this.tab, false);

    this.contentLayer.removeAll(true);

    // 技能页不列角色专属技能：它们跟着角色走，不进槽也不能买卖。
    // 武器页同理滤掉 exclusive（巫女的火弹），它也是绑在角色身上的，不单卖
    const table = SHOP_CATEGORIES[this.tab].table;
    const list = Object.values(table).filter(def => {
      if (this.tab === 'skill') return !def.innate;
      if (this.tab === 'weapon') return !def.exclusive;
      return true;
    });

    const colX = [192, 480, 768];
    const rowY = [272, 450];
    list.forEach((def, i) => {
      this.contentLayer.add(
        this.buildCard(colX[i % 3], rowY[Math.floor(i / 3)], this.tab, def));
    });
  }

  buildCard(cx, cy, kind, def) {
    const w = 268, h = 180;
    const owned = this.isOwned(kind, def.key);
    const c = this.add.container(cx, cy);

    const g = this.add.graphics();
    g.fillStyle(0x152130, 1);
    g.fillRoundedRect(-w/2, -h/2, w, h, 14);
    // 已拥有的卡片边框换成暗绿，一眼就能扫出"这些不用再看了"
    g.lineStyle(2, owned ? 0x3d6b4a : 0x33404f, 1);
    g.strokeRoundedRect(-w/2, -h/2, w, h, 14);
    c.add(g);

    // 左侧图标：角色直接摆它的立绘，武器和技能用符号，扫一眼就能分类
    if (kind === 'character') {
      c.add(CharArt.add(this, -94, 6, def, 0.92));
    } else if (kind === 'weapon') {
      c.add(this.add.circle(-94, 6, 24, 0x0b1520, 1).setStrokeStyle(2, 0x33404f, 1));
      c.add(this.add.image(-94, 6, 'bullet-p').setScale(1.8).setTint(def.color));
    } else {
      c.add(this.add.circle(-94, 6, 24, 0x0b1520, 1).setStrokeStyle(2, 0x33404f, 1));
      c.add(this.add.circle(-94, 6, 16, def.color, 1));
      c.add(this.add.text(-94, 6, def.name.charAt(0), {
        fontFamily: UI.FONT, fontSize: '16px', color: '#0b1520', fontStyle: 'bold',
      }).setOrigin(0.5));
    }

    c.add(this.add.text(-58, -76, def.name, {
      fontFamily: UI.FONT, fontSize: '18px',
      color: owned ? '#8fa3b8' : '#ffffff', fontStyle: 'bold',
    }).setOrigin(0, 0));

    // 描述：useAdvancedWrap 必须开，否则中文整行没有空格，
    // Phaser 的基础换行会把整段当成一个"词"，直接溢出卡片
    let desc = def.desc;
    if (kind === 'character') {
      // 专属技能可能有不止一个（巫女有两个），卡片这里只列名字：
      // 两段长描述叠上去会把这 180 px 高的卡片撑爆，详细说明留给整备界面的轮盘
      const innates = (def.skills || []).map(k => SKILLS[k]).filter(Boolean);
      desc += '\n' + innates.map(s => '专属 ' + s.name).join(' · ');
    }
    c.add(this.add.text(-58, -48, desc, {
      fontFamily: UI.FONT, fontSize: '11px', color: '#a9bdd0',
      wordWrap: { width: 172, useAdvancedWrap: true }, lineSpacing: 2,
    }).setOrigin(0, 0));

    c.add(this.add.text(-58, 14, this.cardStats(kind, def), {
      fontFamily: UI.FONT, fontSize: '12px', color: '#7fffa0',
    }).setOrigin(0, 0));

    // 右下角动作按钮：未拥有→购买，已拥有→置灰
    let label = '购买 ' + def.cost;
    let enabled = true;
    let fill = 0x8b6a3f, hover = 0xb08a55;
    let action = () => this.buy(kind, def);

    if (owned) {
      label = '已 拥 有';
      enabled = false;
      action = () => {};
    } else {
      enabled = Storage.readCoins() >= def.cost;
    }

    c.add(this.makeCardButton(62, 62, label, enabled, fill, hover, action));
    return c;
  }

  cardStats(kind, def) {
    if (kind === 'character') {
      return '生命 ' + def.lives + ' · 移速 ×' + def.speedMul.toFixed(2);
    }
    if (kind === 'weapon') {
      const pellets = def.pattern === 'spread' ? 3 : 1;
      const dps = (def.damage * pellets / (def.interval / 1000)).toFixed(1);
      return '射速 ' + def.interval + 'ms · 伤害 ' + def.damage + ' · ' + dps + ' DPS';
    }
    return def.cooldown > 0 ? '冷却 ' + (def.cooldown / 1000) + ' 秒' : '常驻生效';
  }

  isOwned(kind, key) { return this.loadout.owned[kind].indexOf(key) >= 0; }

  buy(kind, def) {
    const coins = Storage.readCoins();
    if (coins < def.cost) { this.flashCoins(); return; }

    Storage.writeCoins(coins - def.cost);
    if (this.loadout.owned[kind].indexOf(def.key) < 0) this.loadout.owned[kind].push(def.key);
    Storage.writeLoadout(this.loadout);

    SoundSys.pickup();
    this.showToast('已解锁  ' + def.name);
    this.refresh();
  }

  makeCardButton(cx, cy, label, enabled, fill, hover, onClick) {
    const c = this.add.container(cx, cy);
    const w = 116, h = 36;
    const g = this.add.graphics();

    const draw = (hovered) => {
      g.clear();
      const base = enabled ? (hovered ? hover : fill) : 0x2a3442;
      g.fillStyle(0x000000, 0.3);
      g.fillRoundedRect(-w/2 + 2, -h/2 + 3, w, h, 10);
      g.fillStyle(base, 1);
      g.fillRoundedRect(-w/2, -h/2, w, h, 10);
      g.lineStyle(2, enabled ? 0xffffff : 0x44505f, enabled ? 0.45 : 0.6);
      g.strokeRoundedRect(-w/2, -h/2, w, h, 10);
    };
    draw(false);
    c.add(g);

    c.add(this.add.text(0, 0, label, {
      fontFamily: UI.FONT, fontSize: '15px', fontStyle: 'bold',
      color: enabled ? '#ffffff' : '#8fa3b8',
    }).setOrigin(0.5));

    if (enabled) {
      const hit = this.add.rectangle(0, 0, w, h, 0x000000, 0).setInteractive({ useHandCursor: true });
      hit.on('pointerover', () => draw(true));
      hit.on('pointerout',  () => draw(false));
      hit.on('pointerdown', () => { SoundSys.unlock(); SoundSys.uiClick(); onClick(); });
      c.add(hit);
    }
    return c;
  }

  flashCoins() {
    SoundSys.comboBreak();
    const t = this.add.text(CONFIG.width - 40, 78, '金币不够', {
      fontFamily: UI.FONT, fontSize: '14px', color: '#ff7a7a', fontStyle: 'bold',
    }).setOrigin(1, 0.5);
    this.tweens.add({
      targets: t, y: 62, alpha: 0, duration: 700, ease: 'Quad.easeOut',
      onComplete: () => t.destroy(),
    });
  }

  showToast(msg) {
    const t = this.add.text(CONFIG.width / 2, CONFIG.height - 118, msg, {
      fontFamily: UI.FONT, fontSize: '20px', color: '#ffe066', fontStyle: 'bold',
      stroke: '#000000', strokeThickness: 4,
    }).setOrigin(0.5).setDepth(6000);
    t.setScale(0.7);
    this.tweens.add({ targets: t, scale: 1, duration: 160, ease: 'Back.easeOut' });
    this.tweens.add({
      targets: t, alpha: 0, y: t.y - 24, delay: 520, duration: 520,
      onComplete: () => t.destroy(),
    });
  }
}

/* ============================================================================
   装备 —— 只负责"换"
   ----------------------------------------------------------------------------
   上面是角色轮盘（左右箭头循环切换已拥有的角色），
   下面四个槽位：武器 / 专属技能 / 技能槽 1 / 技能槽 2。
   点槽位会在它上方弹出一张小卡片列表，点选项就直接换上。
   ============================================================================ */
class LoadoutScene extends Phaser.Scene {
  constructor() { super('Loadout'); }

  /* 角色轮盘要摆立绘，图集不加载的话巫女 / 勇者会退回程序化圆球 */
  preload() {
    loadCharSheets(this);
    loadFxSheets(this);
  }

  create() {
    Textures.ensure(this);
    SoundSys.setMuted(Storage.readMute());

    this.loadout = Storage.readLoadout();
    this.popup = null;
    this._slideTween = null;

    const W = CONFIG.width, H = CONFIG.height;

    const bg = this.add.graphics().setDepth(-100);
    bg.fillStyle(0x060b12, 1);
    bg.fillRect(0, 0, W, H);
    bg.fillStyle(0x101c2a, 1); bg.fillCircle(W/2, H/2 - 40, 520);
    bg.fillStyle(0x16263a, 1); bg.fillCircle(W/2, H/2 - 40, 380);

    this.add.text(40, 32, '装 备', {
      fontFamily: UI.FONT, fontSize: '30px', color: '#ffe066', fontStyle: 'bold',
    }).setOrigin(0, 0);

    this.add.text(42, 74, 'L O A D O U T', {
      fontFamily: UI.MONO, fontSize: '12px', color: '#55697d', letterSpacing: 6,
    }).setOrigin(0, 0);

    this.coinText = this.add.text(W - 40, 48, '', {
      fontFamily: UI.MONO, fontSize: '22px', color: '#ffd54a', fontStyle: 'bold',
    }).setOrigin(1, 0.5);

    this.buildCarousel();
    this.buildSlots();

    UI.makeButton(this, W / 2 - 140, H - 44, 220, 54, '返 回 主 菜 单', 0x5d452a, 0x8b6a3f, () => {
      this.scene.start('Menu');
    }, '19px');
    UI.makeButton(this, W / 2 + 140, H - 44, 220, 54, '去 商 城', 0x8b6a3f, 0xb08a55, () => {
      this.scene.start('Shop');
    }, '19px');

    this.input.keyboard.on('keydown-ESC', () => {
      if (this.popup) this.closePopup();
      else this.scene.start('Menu');
    });

    this.refresh();
  }

  /* ======================= 角色轮盘 ======================= */

  buildCarousel() {
    const W = CONFIG.width;
    this.carouselY = 205;

    this.arrowLeft  = this.makeArrow(W / 2 - 168, this.carouselY, -1);
    this.arrowRight = this.makeArrow(W / 2 + 168, this.carouselY,  1);

    // 轮盘上的立绘比商城卡片大一档，所以额外乘一个系数；
    // 存成成员变量，换角色时重设缩放要用同一个值
    this.carouselMul = 1.4;
    this.charSprite = CharArt.add(this, W / 2, this.carouselY,
      CHARACTERS.gunner, this.carouselMul);

    this.charName = this.add.text(W / 2, this.carouselY + 78, '', {
      fontFamily: UI.FONT, fontSize: '26px', color: '#ffffff', fontStyle: 'bold',
    }).setOrigin(0.5);

    this.charDesc = this.add.text(W / 2, this.carouselY + 108, '', {
      fontFamily: UI.FONT, fontSize: '13px', color: '#8fa3b8',
    }).setOrigin(0.5);

    // 专属技能可能不止一条（巫女有两条），所以这里要允许换行并居中对齐
    this.charSkill = this.add.text(W / 2, this.carouselY + 132, '', {
      fontFamily: UI.FONT, fontSize: '13px', color: '#7fffa0',
      align: 'center', lineSpacing: 3,
    }).setOrigin(0.5);
  }

  makeArrow(x, y, dir) {
    const c = this.add.container(x, y);
    const g = this.add.graphics();

    const draw = (hovered) => {
      g.clear();
      g.fillStyle(0x0b1520, hovered ? 0.95 : 0.72);
      g.fillCircle(0, 0, 26);
      g.lineStyle(2, hovered ? 0xffffff : 0x8fa3b8, 0.9);
      g.strokeCircle(0, 0, 26);
      g.fillStyle(0xffffff, 1);
      if (dir < 0) g.fillTriangle(9, -13, 9, 13, -9, 0);
      else         g.fillTriangle(-9, -13, -9, 13, 9, 0);
    };
    draw(false);
    c.add(g);

    const hit = this.add.circle(0, 0, 30, 0x000000, 0).setInteractive({ useHandCursor: true });
    hit.on('pointerover', () => draw(true));
    hit.on('pointerout',  () => draw(false));
    hit.on('pointerdown', () => {
      SoundSys.unlock(); SoundSys.uiClick();
      this.changeChar(dir);
    });
    c.add(hit);
    return c;
  }

  /* 只在"已拥有的角色"之间循环。没买到的角色不能装，
     放进轮盘只会让玩家以为能直接用，点下去才发现是锁的 */
  changeChar(dir) {
    const owned = this.loadout.owned.character;
    if (owned.length < 2) return;

    let i = owned.indexOf(this.loadout.character);
    if (i < 0) i = 0;
    const ni = (i + dir + owned.length) % owned.length;
    const nextKey = owned[ni];
    if (nextKey === this.loadout.character) return;

    this.loadout.character = nextKey;
    Storage.writeLoadout(this.loadout);

    const W = CONFIG.width;
    const old = this.charSprite;
    const incoming = CharArt.add(this, W / 2 + dir * 170, this.carouselY,
      CHARACTERS[nextKey], this.carouselMul);
    incoming.setAlpha(0);

    this.tweens.killTweensOf(old);
    this.tweens.add({
      targets: old, x: W / 2 - dir * 170, alpha: 0, duration: 200, ease: 'Quad.easeIn',
      onComplete: () => old.destroy(),
    });
    this.tweens.add({
      targets: incoming, x: W / 2, alpha: 1, duration: 240, ease: 'Quad.easeOut',
    });
    this.charSprite = incoming;

    SoundSys.uiClick();
    this.closePopup();
    this.refresh();
  }

  /* ======================= 四个槽位 ======================= */

  buildSlots() {
    const W = CONFIG.width;
    const bw = 182, bh = 142, gap = 20;
    const total = 4 * bw + 3 * gap;
    const startX = (W - total) / 2;
    this.slotY = 442;

    this.slotDefs = [
      { kind: 'weapon', label: '武 器' },
      { kind: 'innate', label: '专属技能' },
      { kind: 'skill',  label: '技能槽 1', idx: 0 },
      { kind: 'skill',  label: '技能槽 2', idx: 1 },
    ];

    this.slotViews = this.slotDefs.map((def, i) => {
      const cx = startX + bw / 2 + i * (bw + gap);
      return this.buildSlot(cx, this.slotY, bw, bh, def, i);
    });
  }

  buildSlot(cx, cy, w, h, def, index) {
    const container = this.add.container(cx, cy);
    const g = this.add.graphics();
    container.add(g);

    const labelText = this.add.text(0, -h / 2 + 18, def.label, {
      fontFamily: UI.FONT, fontSize: '13px', color: '#8fa3b8', fontStyle: 'bold',
    }).setOrigin(0.5);
    container.add(labelText);

    const iconC = this.add.container(0, -8);
    container.add(iconC);

    const nameText = this.add.text(0, h / 2 - 24, '', {
      fontFamily: UI.FONT, fontSize: '15px', color: '#ffffff', fontStyle: 'bold',
    }).setOrigin(0.5);
    container.add(nameText);

    const view = {
      container, g, iconC, nameText, index, def, _hover: false,
    };

    const draw = () => {
      g.clear();
      const hovered = view._hover;
      g.fillStyle(hovered ? 0x1a2a3c : 0x152130, 1);
      g.fillRoundedRect(-w / 2, -h / 2, w, h, 16);
      g.lineStyle(2.5, hovered ? 0x4ac2ff : 0x33404f, 1);
      g.strokeRoundedRect(-w / 2, -h / 2, w, h, 16);
    };
    view.draw = draw;
    draw();

    const hit = this.add.rectangle(0, 0, w, h, 0x000000, 0).setInteractive({ useHandCursor: true });
    hit.on('pointerover', () => { view._hover = true; draw(); });
    hit.on('pointerout',  () => { view._hover = false; draw(); });
    hit.on('pointerdown', () => {
      SoundSys.unlock(); SoundSys.uiClick();
      this.onSlotClick(index);
    });
    container.add(hit);

    // 图标区更新：清空重建，比维护一堆对象引用的显隐简单，也只有 4 个槽位
    view.update = (item) => {
      iconC.removeAll(true);
      if (item.icon === 'weapon') {
        iconC.add(this.add.circle(0, 0, 30, 0x0b1520, 1).setStrokeStyle(2, 0x33404f, 1));
        iconC.add(this.add.image(0, 0, 'bullet-p').setScale(2.2).setTint(item.color));
      } else if (item.def) {
        iconC.add(this.add.circle(0, 0, 30, item.color, 1));
        iconC.add(this.add.text(0, 0, item.def.name.charAt(0), {
          fontFamily: UI.FONT, fontSize: '24px', color: '#0b1520', fontStyle: 'bold',
        }).setOrigin(0.5));
      } else {
        iconC.add(this.add.circle(0, 0, 30, 0x0b1520, 1).setStrokeStyle(2, 0x33404f, 1));
        iconC.add(this.add.text(0, 0, '空', {
          fontFamily: UI.FONT, fontSize: '18px', color: '#55697d',
        }).setOrigin(0.5));
      }
      nameText.setText(item.name);
      nameText.setColor(item.def ? '#ffffff' : '#55697d');
    };

    return view;
  }

  /* ======================= 弹窗 ======================= */

  onSlotClick(index) {
    const def = this.slotDefs[index];

    if (def.kind === 'innate') {
      this.showToast('专属技能跟随角色，无法更换');
      return;
    }
    // 锁武器的角色（巫女）点武器槽直接说明原因，
    // 别让玩家翻完整个武器列表才发现一把都换不了
    if (def.kind === 'weapon' && this.lockInfo) {
      this.showToast('当前角色锁定「' + this.lockInfo.name + '」，无法更换武器');
      return;
    }
    // 再点同一个槽位就收起，等于一个开关
    if (this.popup && this.popup.slotIndex === index) {
      this.closePopup();
      return;
    }
    this.openPopup(index);
  }

  openPopup(slotIndex) {
    this.closePopup();

    const def = this.slotDefs[slotIndex];
    const slotView = this.slotViews[slotIndex];
    const W = CONFIG.width;

    // 组装这个槽位能选的东西
    let options = [];
    if (def.kind === 'weapon') {
      options = this.loadout.owned.weapon.map(k => ({
        key: k, kind: 'weapon', def: WEAPONS[k],
        equipped: this.loadout.weapon === k,
      }));
    } else {
      options = this.loadout.owned.skill
        .filter(k => SKILLS[k] && !SKILLS[k].innate)
        .map(k => ({
          key: k, kind: 'skill', def: SKILLS[k],
          equipped: this.loadout.skills[def.idx] === k,
        }));
      // 末尾永远给一个"卸下"，否则装上了就再也换不下来了
      options.push({
        key: null, kind: 'skill', def: null,
        equipped: !this.loadout.skills[def.idx],
      });
    }

    const popW = 500;
    const headH = 42;
    const rowH = 54;
    const popH = headH + options.length * rowH + 12;

    let popX = slotView.container.x - popW / 2;
    popX = Phaser.Math.Clamp(popX, 16, W - popW - 16);
    // 优先贴在槽位上方；放不下（选项太多）就顶到画布顶端，宁可盖住角色也不能跑出屏幕
    let popY = slotView.container.y - 71 - popH - 14;
    popY = Math.max(14, popY);

    const layer = this.add.container(0, 0).setDepth(5000);

    const g = this.add.graphics();
    g.fillStyle(0x0b1520, 0.98);
    g.fillRoundedRect(popX, popY, popW, popH, 16);
    g.lineStyle(2.5, 0x4a90d9, 0.9);
    g.strokeRoundedRect(popX, popY, popW, popH, 16);
    layer.add(g);

    const title = this.add.text(popX + 20, popY + 22, '更换 · ' + def.label, {
      fontFamily: UI.FONT, fontSize: '16px', color: '#ffe066', fontStyle: 'bold',
    }).setOrigin(0, 0.5);
    layer.add(title);

    const closeBtn = this.add.text(popX + popW - 24, popY + 22, '✕', {
      fontFamily: UI.FONT, fontSize: '18px', color: '#8fa3b8', fontStyle: 'bold',
    }).setOrigin(0.5);
    closeBtn.setInteractive({ useHandCursor: true });
    closeBtn.on('pointerover', () => closeBtn.setColor('#ffffff'));
    closeBtn.on('pointerout',  () => closeBtn.setColor('#8fa3b8'));
    closeBtn.on('pointerdown', () => { SoundSys.unlock(); SoundSys.uiClick(); this.closePopup(); });
    layer.add(closeBtn);

    options.forEach((opt, i) => {
      const rowY = popY + headH + i * rowH;
      layer.add(this.buildPopupRow(popX + 10, rowY, popW - 20, rowH - 6, opt, slotIndex));
    });

    this.popup = { slotIndex, layer, x: popX, y: popY, w: popW, h: popH };
    layer.setAlpha(0);
    this.tweens.add({ targets: layer, alpha: 1, duration: 120 });
  }

  buildPopupRow(x, y, w, h, opt, slotIndex) {
    const c = this.add.container(x, y);
    const g = this.add.graphics();
    c.add(g);

    const isNone = !opt.key;
    const equipped = opt.equipped;

    const draw = (hovered) => {
      g.clear();
      g.fillStyle(equipped ? 0x1c3a28 : (hovered ? 0x1d304a : 0x152130), 1);
      g.fillRoundedRect(0, 0, w, h, 10);
      g.lineStyle(equipped ? 2 : 1.5, equipped ? 0x7fffa0 : 0x33404f, 1);
      g.strokeRoundedRect(0, 0, w, h, 10);
    };
    draw(false);

    const iconX = 34, iconY = h / 2;

    if (isNone) {
      c.add(this.add.circle(iconX, iconY, 16, 0x2a3442, 1).setStrokeStyle(1.5, 0x44505f, 1));
      c.add(this.add.text(iconX, iconY, '空', {
        fontFamily: UI.FONT, fontSize: '12px', color: '#8fa3b8',
      }).setOrigin(0.5));
    } else if (opt.kind === 'weapon') {
      c.add(this.add.circle(iconX, iconY, 17, 0x0b1520, 1).setStrokeStyle(2, 0x33404f, 1));
      c.add(this.add.image(iconX, iconY, 'bullet-p').setScale(1.5).setTint(opt.def.color));
    } else {
      c.add(this.add.circle(iconX, iconY, 17, opt.def.color, 1));
      c.add(this.add.text(iconX, iconY, opt.def.name.charAt(0), {
        fontFamily: UI.FONT, fontSize: '15px', color: '#0b1520', fontStyle: 'bold',
      }).setOrigin(0.5));
    }

    c.add(this.add.text(62, iconY - 11, isNone ? '卸下当前技能' : opt.def.name, {
      fontFamily: UI.FONT, fontSize: '15px',
      color: equipped ? '#7fffa0' : '#ffffff', fontStyle: 'bold',
    }).setOrigin(0, 0.5));

    const desc = isNone ? '空出这个技能槽' : opt.def.desc;
    c.add(this.add.text(62, iconY + 11, desc, {
      fontFamily: UI.FONT, fontSize: '11px', color: '#8fa3b8',
      wordWrap: { width: w - 190, useAdvancedWrap: true },
    }).setOrigin(0, 0.5));

    c.add(this.add.text(w - 14, iconY, equipped ? '使用中' : '点击更换', {
      fontFamily: UI.FONT, fontSize: '12px',
      color: equipped ? '#7fffa0' : '#55697d', fontStyle: 'bold',
    }).setOrigin(1, 0.5));

    const hit = this.add.rectangle(w / 2, h / 2, w, h, 0x000000, 0)
      .setInteractive({ useHandCursor: true });
    hit.on('pointerover', () => draw(true));
    hit.on('pointerout',  () => draw(false));
    hit.on('pointerdown', () => {
      SoundSys.unlock(); SoundSys.uiClick();
      this.applySlotChoice(slotIndex, opt);
    });
    c.add(hit);

    return c;
  }

  applySlotChoice(slotIndex, opt) {
    const def = this.slotDefs[slotIndex];

    if (def.kind === 'weapon') {
      this.loadout.weapon = opt.key;
    } else {
      // 同一个技能不能同时占两个槽：先把它从另一个槽里摘掉
      if (opt.key) {
        const other = def.idx === 0 ? 1 : 0;
        if (this.loadout.skills[other] === opt.key) this.loadout.skills[other] = null;
      }
      this.loadout.skills[def.idx] = opt.key;
    }

    Storage.writeLoadout(this.loadout);
    SoundSys.pickup();
    this.closePopup();
    this.refresh();
    this.showToast(opt.key ? '已装备  ' + opt.def.name : '已卸下');
  }

  closePopup() {
    if (!this.popup) return;
    const layer = this.popup.layer;
    this.popup = null;
    this.tweens.killTweensOf(layer);
    layer.destroy();
  }

  /* ======================= 重绘 ======================= */

  refresh() {
    this.coinText.setText('金币  ' + Storage.readCoins());

    const ch = CHARACTERS[this.loadout.character] || CHARACTERS.gunner;
    const innates = (ch.skills || []).map(k => SKILLS[k]).filter(Boolean);

    // 图集角色换的是"图集名 + 帧号"，程序化角色换的是纹理名，两边判断条件不同
    const art = CharArt.resolve(this, ch);
    if (this.charSprite.texture.key !== art.key) {
      this.charSprite.setTexture(art.key, art.frame);
    }
    this.charSprite.setScale(CharArt.fit(this, ch, this.carouselMul));

    this.charName.setText(ch.name);
    this.charDesc.setText(ch.desc);
    // 专属技能可能有两个，一行拼起来会顶到画面边缘，分行写
    this.charSkill.setText(innates.map(s => '专属 ' + s.name + ' · ' + s.desc).join('\n'));

    // 只有一个角色时箭头没意义，压暗提示"没得换"
    const canCycle = this.loadout.owned.character.length > 1;
    this.arrowLeft.setAlpha(canCycle ? 1 : 0.3);
    this.arrowRight.setAlpha(canCycle ? 1 : 0.3);

    // 角色锁武器时（巫女），武器槽要显示真正生效的那把并标注"锁定"：
    // 否则玩家看着自己装的手枪、进去打出来却是火弹，只会以为是 bug
    this.lockInfo = ch.weaponLock ? (WEAPONS[ch.weaponLock] || null) : null;
    const wp = this.lockInfo || WEAPONS[this.loadout.weapon] || WEAPONS.pistol;

    const s0 = this.loadout.skills[0] ? SKILLS[this.loadout.skills[0]] : null;
    const s1 = this.loadout.skills[1] ? SKILLS[this.loadout.skills[1]] : null;
    // 专属技能槽只有一个格子，有两个专属时把名字并排塞进去
    const innateName = innates.map(s => s.name).join(' / ') || '无';

    const items = [
      { icon: 'weapon', def: wp, name: wp.name + (this.lockInfo ? ' ·锁定' : ''), color: wp.color },
      { icon: 'skill',  def: innates[0] || null, name: innateName,
        color: innates[0] ? innates[0].color : 0x33404f },
      { icon: 'skill',  def: s0,     name: s0 ? s0.name : '空', color: s0 ? s0.color : 0x33404f },
      { icon: 'skill',  def: s1,     name: s1 ? s1.name : '空', color: s1 ? s1.color : 0x33404f },
    ];

    this.slotViews.forEach((v, i) => v.update(items[i]));
  }

  showToast(msg) {
    const t = this.add.text(CONFIG.width / 2, CONFIG.height - 92, msg, {
      fontFamily: UI.FONT, fontSize: '18px', color: '#ffe066', fontStyle: 'bold',
      stroke: '#000000', strokeThickness: 4,
    }).setOrigin(0.5).setDepth(6000);
    t.setScale(0.7);
    this.tweens.add({ targets: t, scale: 1, duration: 160, ease: 'Back.easeOut' });
    this.tweens.add({
      targets: t, alpha: 0, y: t.y - 22, delay: 520, duration: 520,
      onComplete: () => t.destroy(),
    });
  }
}

/* ============================================================================
   游戏场景
   ============================================================================ */
class GameScene extends Phaser.Scene {
  constructor() { super('Game'); }

  preload() {
    // 六张敌人行走图集，单帧统一 64×64，朝向按行排列：下 / 上 / 左 / 右。
    // 每向帧数不固定（四张 8 帧、两张 6 帧），动画区间按图集规格算
    loadEnemySheets(this);

    // 可玩角色的图集（巫女 / 勇者 / 矮人）
    loadCharSheets(this);

    // 爆炸 / 火花 / 鞭炮 / 炸药四张特效图集
    loadFxSheets(this);

    // BOSS 骷髅王的九张动作图集（只有肉鸽模式会用到，但一起加载掉，
    // 免得 BOSS 出场那一刻再去读文件，正好卡在"黑影变大"的节骨眼上）
    loadBossSheets(this);
  }

  create(data) {
    Textures.ensure(this);

    // 模式开关：主菜单点"肉鸽模式"时传 { mode:'rogue' }，其余都是原来的无限模式。
    // 两个模式共用同一个 GameScene —— 刷怪 / 难度 / 技能那一整套完全一样，
    // 只有"阶段推进 + 增幅三选一 + BOSS"是肉鸽独有的，用这个开关隔开
    this.rogueMode = !!(data && data.mode === 'rogue');

    this.state = 'playing';
    this.score = 0;
    this.best = Storage.readBest();
    SoundSys.setMuted(Storage.readMute());

    // ---- 整备：角色 / 武器 / 技能进游戏前就已经定好，create 里一次性解析出来 ----
    this.loadout = Storage.readLoadout();
    this.charDef = CHARACTERS[this.loadout.character] || CHARACTERS.gunner;
    // 角色锁武器时（巫女的火弹）直接无视整备里选的那把 —— 这是角色机制，不是漏判
    this.weaponDef = this.charDef.weaponLock
      ? (WEAPONS[this.charDef.weaponLock] || WEAPONS.pistol)
      : (WEAPONS[this.loadout.weapon] || WEAPONS.pistol);

    // 专属技能是数组：多数角色 1 个，巫女 2 个。槽位里是买来的技能，
    // 专属技能不占槽，两者拼成真正生效的技能列表
    this.innateSkills = (this.charDef.skills || []).map(k => SKILLS[k]).filter(Boolean);
    this.equippedSkills = this.loadout.skills
      .filter(k => k && SKILLS[k] && !SKILLS[k].innate)
      .map(k => SKILLS[k]);
    this.allSkills = this.innateSkills.concat(this.equippedSkills);

    // 主动技能（巫女的堕天形态）不参与自动冷却，它走右下角按钮 + 每局次数。
    // 左下角技能栏只画被动技能，否则同一个技能会在屏幕上出现两遍
    this.activeSkill = this.allSkills.find(s => s.active) || null;
    this.hudSkills = this.allSkills.filter(s => s !== this.activeSkill);

    this.maxLives = this.charDef.lives;
    this.lives = this.maxLives;
    this.coins = Storage.readCoins();
    this.coinsEarned = 0;
    this._lastCoinSave = 0;
    this.reviveUsed = false;

    // 技能计时用"每帧累加 dms"而不是 Phaser 定时器：
    // 暂停和慢动作会改掉 Phaser 时钟，累加 dms 则天然跟着游戏一起停、一起慢。
    // 首次触发只等 55% 冷却，让玩家开局没多久就能看到自己的技能
    this.skillTimer = {};
    this.skillActive = {};
    this.skillCharges = {};
    // 主动技能有两种限制方式，状态表分开存：
    //   skillCharges      —— 次数模式（巫女的堕天形态、勇者的冲锋），用光就整局没了
    //   skillCooldownLeft —— 动态冷却模式（矮人的炸药投掷），用一次冷却长一截
    //   skillCooldownTotal—— 本次冷却的总时长，画按钮外圈进度弧用
    //   skillCooldownUse  —— 已经用了几次，用来算下一次冷却有多长
    this.skillCooldownLeft = {};
    this.skillCooldownTotal = {};
    this.skillCooldownUse = {};
    for (const s of this.allSkills) {
      this.skillTimer[s.key] = s.cooldown > 0 ? s.cooldown * 0.55 : 0;
      this.skillActive[s.key] = 0;
      // 次数模式技能的每局次数；冷却模式 / 被动技能用不到，给 0 就行
      this.skillCharges[s.key] = s.charges || 0;
      this.skillCooldownLeft[s.key] = 0;
      this.skillCooldownTotal[s.key] = 0;
      this.skillCooldownUse[s.key] = 0;
    }

    // 受伤动画剩余时间。归零就切回跑步动画，所以它同时是"当前该播哪个动作"的依据
    this.playerHurtMs = 0;
    // 技能施法动画的帧计时（skillAnimTick 用），每次触发技能时归零
    this.skillAnimMs = 0;
    // 当前正在播的动画 key / 帧标记，用来挡住"每帧重调 play 把播放头按回第 0 帧"
    this.playerAnimKey = '';
    this._darkTinted = false;

    // 勇者·裂地斩的冲击波列表 + 绘制层。技能是瞬发的，冲击波自己带生命周期，
    // 走完就从数组里摘掉，不留常驻对象
    this.shockwaves = [];
    this.shockwaveFX = this.add.graphics().setDepth(7100);
    // 勇者·破军冲锋的方向与速度，按下技能那一刻写入
    this.chargeDir = null;
    this.chargeSpeed = 0;

    // ⚠️ 主动技能按钮的引用必须显式清空。
    // Phaser 的 Scene 实例在整个游戏期间是复用的，restart / 切换场景
    // 只是重新跑 create()，实例属性不会自动清空。
    // 如果上一局用的是巫女 / 勇者（有主动技能），activeBtn 已经指向一个对象；
    // 这局换成矮人（没有主动技能），buildActiveSkillButton 提前 return，
    // activeBtn 就残留成了上一局的对象，而 activeSkill 又是 null，
    // updateActiveSkillFX 里读 s.key 直接抛异常，游戏进不去
    this.activeBtn = null;
    this.activeBtnG = null;
    this.activeBtnText = null;
    this.activeBtnLabel = null;

    this.elapsed = 0;
    this.spawnAccum = 0;
    this.fireAccum = 0;
    this.gameOverAt = 0;
    this._lastLevelText = '';

    this.difficultyLevel = 0;
    this.nextLevelAt = CONFIG.diffIntervalBase;

    this.comboCount = 0;
    this.comboTimer = 0;

    this.buffs = { rapid: 0, triple: 0, shield: false };
    this.heartbeatTimer = 0;
    this._buffSig = '';

    this.touchDir = null;
    this.touchStart = null;
    this.lastHorizPress = 0;
    this.lastVertPress = 0;
    this.isSpawning = false;
    this._noInfantryStreak = 0;
    this._spawnWatchdog = 0;
    this._slowMoTimer = null;
    // 用 performance.now() 记时间：time.now 会被慢动作 / 暂停改掉，不能用来做冷却
    this._shakeUntil = 0;
    this._grazeReady = 0;
    this.resetTimeScale();   // 场景重启时保证时间缩放归位

    // 图集没加载成功（离线 / 丢文件）时，对应兵种退回矢量贴图而不是报错。
    // 帧数阈值必须按图集自己的规格算，写死 32 会让 24 帧的新图集被判成"没加载成功"
    this.sheetReady = {};
    for (const key of SHEET_KEYS) {
      this.sheetReady[key] = this.hasSheet(key, SHEET_FRAMES_PER_DIR[key] * 4);
    }

    // ---- 肉鸽状态 ----
    // mods 在无限模式下也会建出来（全是默认值），
    // 这样 fireVolley / updatePlayer 里读修正的地方不用到处判空
    this.rogue = {
      map: 0,
      phase: 'wave',                       // wave → bossIntro → boss → （下一张图）wave
      waveLeft: ROGUE.waveMs[0],
      nextBuffAt: ROGUE.buffStepBase,      // 第 1 张卡只要 300 分
      curStep: ROGUE.buffStepBase,         // 当前这一段的宽度（HUD 进度条要用）
      buffsTaken: 0,                       // 已经跨过几条积分线，决定下一段阈值有多宽
      pendingBuffs: 0,                     // 攒着还没弹的三选一次数
      picks: [],
      killCount: 0,
      healCount: 0,
      mods: {
        dmgMul: 1, intervalMul: 1, moveMul: 1, bspeedMul: 1, scoreMul: 1,
        bossDmgMul: 1, invMul: 1,
        pierceAdd: 0, multiShot: 0,
        healEvery: 0, boomChance: 0, critChance: 0, critMul: 2.5,
      },
    };
    this.boss = null;
    this.bossState = 'none';
    this.bossT = 0;
    this.bossCue = null;
    this.bossHp = 0;
    this.bossHpMax = 0;
    this.bossFacing = 'down';
    this.bossShocks = [];
    this.bossSlashDir = 0;
    this.bossSlashFired = 0;
    this.bossSpinFired = 0;
    this.bossAnimKey = '';
    this.bossNext = 'spin';
    this.bossPauseMs = BOSS.idleMs;
    // 本场 BOSS 的缠斗时长，喂给狂暴系数（每张图重新计时）
    this.bossFightMs = 0;
    // 当前该用哪一档 BOSS 节奏，由 refreshBossTune() 每帧刷新
    this.bossTune = null;
    this.bossJumpFrom = null;
    this.bossJumpTo = null;
    this._bossFlashAt = 0;
    this._boomDepth = 0;
    // 三选一当前待选的卡。场景实例会复用，这里不清的话，
    // 上一局没选完的卡会被下一局的数字键重新选中
    this._buffChoice = null;
    // BOSS 结算被暂停/选卡推迟时挂在这里，回到 playing 由 updateRogue 补跑
    this._bossDefeatPending = false;

    this.buildBackground();
    this.buildPools();
    this.buildPlayer();
    this.buildParticles();
    this.buildFX();
    this.buildHUD();
    this.buildPauseButton();
    this.buildShieldFX();
    this.buildPowerupRing();
    this.buildBossLayer();

    // 肉鸽模式要在屏幕上方腾出 BOSS 血条的位置（y 46~76），
    // 连击条原本贴在 y=84，会跟血条边框压在一起，整体往下挪一档
    if (this.rogueMode) this.comboContainer.setY(112);

    this.overlay = this.add.container(0, 0).setDepth(9500);

    this.setupInput();
    this.setupCollisions();
    this.setupLifecycle();
    this.setupAnimations();

    SoundSys.start();
  }

  /* 图集帧数足够才启用动画，否则 generateFrameNumbers 会产出空帧序列 */
  hasSheet(key, frames) {
    if (!this.textures.exists(key)) return false;
    const tex = this.textures.get(key);
    return (tex.frameTotal - 1) >= frames;
  }

  setupAnimations() {
    // 图集朝向按行排列：第 1 行下、第 2 行上、第 3 行左、第 4 行右。
    // 每向帧数从 SHEET_FRAMES_PER_DIR 取，不能写死 8 —— 有两张图集每向只有 6 帧
    for (const sheet of SHEET_KEYS) {
      if (!this.sheetReady[sheet]) continue;

      const step = SHEET_FRAMES_PER_DIR[sheet];
      const dirs = [
        ['down',  0,             step - 1],
        ['up',    step,          step * 2 - 1],
        ['left',  step * 2,      step * 3 - 1],
        ['right', step * 3,      step * 4 - 1],
      ];

      for (const [dir, start, end] of dirs) {
        const key = sheet + '-walk-' + dir;
        // 场景可被重启，动画注册在全局 AnimationManager 上，重复创建只会刷警告
        if (this.anims.exists(key)) continue;
        this.anims.create({
          key,
          frames: this.anims.generateFrameNumbers(sheet, { start, end }),
          frameRate: 8,
          repeat: -1,
        });
      }
    }

    // 可玩角色：一张图集只装一个动作，行顺序同样是 下 / 上 / 左 / 右。
    // 帧号区间按 CHAR_ANIMS 里写死的列数算，思路和上面敌人那套完全一样
    const DIR_ROWS = ['down', 'up', 'left', 'right'];
    for (const [charKey, anims] of Object.entries(CHAR_ANIMS)) {
      for (const [act, def] of Object.entries(anims)) {
        if (!this.hasSheet(def.file, def.frames * 4)) continue;

        DIR_ROWS.forEach((dir, row) => {
          const key = charKey + '-' + act + '-' + dir;
          if (this.anims.exists(key)) return;

          const frames = this.anims.generateFrameNumbers(def.file,
            { start: row * def.frames, end: (row + 1) * def.frames - 1 });

          this.anims.create({
            key,
            // reverse：这套图集的帧序是倒的（作者把"完成态"画在了最左边那一帧），
            // 把帧数组直接翻过来，播出来就是"从右往左"
            frames: def.reverse ? frames.reverse() : frames,
            frameRate: def.rate,
            repeat: def.repeat,
          });
        });
      }
    }

    // BOSS：一张图集一个动作，行顺序同样是 下 / 上 / 左 / 右。
    // 注意每张图集的单帧尺寸不一样（48 / 64 / 128），帧号区间必须按各自的列数算 ——
    // 用同一套数字去切，48 的图会切出半个身子、128 的图会切进相邻帧
    for (const [act, def] of Object.entries(BOSS_ANIMS)) {
      if (!this.hasSheet(def.file, def.frames * 4)) continue;

      DIR_ROWS.forEach((dir, row) => {
        const key = 'boss-' + act + '-' + dir;
        if (this.anims.exists(key)) return;

        const frames = this.anims.generateFrameNumbers(def.file,
          { start: row * def.frames, end: (row + 1) * def.frames - 1 });

        this.anims.create({
          key,
          // 跳起/落地这套素材是"从地面 → 腾空"画的，boss 要从天上砸下来，
          // 所以跳跃动画倒着播：腾空那帧当起点，落地那帧当终点
          frames: act === 'jump' ? frames.reverse() : frames,
          frameRate: def.rate,
          repeat: def.repeat,
        });
      });
    }
  }

  buildBackground() {
    const C = CONFIG.color;
    const g = this.add.graphics().setDepth(-1000);

    g.fillStyle(C.outside, 1);
    g.fillRect(0, 0, CONFIG.width, CONFIG.height);

    g.fillStyle(C.fenceDark, 1);
    g.fillRect(BOARD.x - 14, BOARD.y - 14, BOARD.w + 28, BOARD.h + 28);
    g.fillStyle(C.fence, 1);
    g.fillRect(BOARD.x - 7, BOARD.y - 7, BOARD.w + 14, BOARD.h + 14);

    g.fillStyle(C.ground, 1);
    g.fillRect(BOARD.x, BOARD.y, BOARD.w, BOARD.h);

    // 用固定种子生成草地斑块，保证每次进游戏纹理一致
    const rnd = new Phaser.Math.RandomDataGenerator(['board-shooter-ground']);
    for (let i = 0; i < 300; i++) {
      const px = BOARD.x + rnd.between(4, BOARD.w - 4);
      const py = BOARD.y + rnd.between(4, BOARD.h - 4);
      const r = rnd.between(3, 10);
      g.fillStyle(rnd.pick([C.groundDark, C.groundLight, C.groundDark]), rnd.realInRange(0.18, 0.42));
      g.fillEllipse(px, py, r * 2.3, r * 1.25);
    }

    g.fillGradientStyle(0x000000, 0x000000, 0x000000, 0x000000, 0.32, 0.32, 0, 0);
    g.fillRect(BOARD.x, BOARD.y, BOARD.w, 16);
    g.fillGradientStyle(0x000000, 0x000000, 0x000000, 0x000000, 0.22, 0, 0.22, 0);
    g.fillRect(BOARD.x, BOARD.y, 14, BOARD.h);

    g.lineStyle(2, 0x000000, 0.22);
    g.strokeRect(BOARD.x + 1, BOARD.y + 1, BOARD.w - 2, BOARD.h - 2);
  }

  buildPools() {
    // 玩家子弹用 Sprite 而不是 Image：鞭炮 / 炸药的贴图是 3×3 的图集，
    // Image 会取整张图（__BASE）显示成一大片色块，Sprite 才能指定取第 0 帧
    this.playerBullets = this.physics.add.group({ classType: Phaser.Physics.Arcade.Sprite, maxSize: CONFIG.poolPlayerBullets });
    this.enemyBullets  = this.physics.add.group({ classType: Phaser.Physics.Arcade.Image, maxSize: CONFIG.poolEnemyBullets });
    this.enemies       = this.physics.add.group({ classType: Phaser.Physics.Arcade.Sprite, maxSize: CONFIG.poolEnemies });
    this.powerups      = this.physics.add.group({ classType: Phaser.Physics.Arcade.Image, maxSize: CONFIG.poolPowerups });
  }

  buildPlayer() {
    const sc = Math.floor(CONFIG.cols / 2);
    const sr = Math.floor(CONFIG.rows / 2);

    // 物理半径可以按角色覆盖：图集角色视觉上比程序化角色瘦一圈，
    // 还按 17 算会出现"看着没碰到却被判定命中"，这是最招人烦的一类手感问题。
    // 这里的 pr 是"屏幕上的半径"，不是 setCircle 的参数 —— 两者差一个缩放，见下面
    const pr = this.charDef.bodyRadius != null ? this.charDef.bodyRadius : CONFIG.playerRadius;
    const r = pr + 4;
    this.physics.world.setBounds(BOARD.x + r, BOARD.y + r, BOARD.w - 2 * r, BOARD.h - 2 * r);

    // 阴影距离也跟角色走：图集角色的脚底在帧内更靠下，写死 +15 会让影子盖在小腿上
    this.shadowDY = this.charDef.shadowOffsetY != null ? this.charDef.shadowOffsetY : 15;
    this.playerShadow = this.add.image(Utils.colCenter(sc), Utils.rowCenter(sr) + this.shadowDY,
      'shadow').setDepth(1);

    // 图集没加载成功就退回程序化纹理（和敌人图集同一个降级策略）——
    // 不能因为丢了一张图让人物在场上变成透明
    // 跑步图集的 key 必须问 charRunSheet，不能拼 '<sheet>-run' ——
    // 勇者那张图集叫 wari-walk，拼错了会静默退回程序化纹理，角色变回一个球
    const runSheet = this.charDef.sheet ? charRunSheet(this.charDef) : null;
    const sheetOk = !!runSheet && this.textures.exists(runSheet);
    const spriteScale = sheetOk
      ? (this.charDef.sheetScale != null ? this.charDef.sheetScale : 2.0)
      : 1;
    const texKey = sheetOk ? runSheet : ('player-' + this.charDef.key + '-down');
    this.player = this.physics.add.sprite(Utils.colCenter(sc), Utils.rowCenter(sr), texKey);

    if (sheetOk) {
      this.player.setScale(spriteScale);
      const startKey = this.charDef.sheet + '-run-down';
      if (this.anims.exists(startKey)) {
        this.player.anims.play(startKey, true);
        this.playerAnimKey = startKey;
      }
    }

    // 两个坑叠在一起，必须同时绕开：
    // 1) Phaser 内部算的是 halfWidth = floor(radius * scaleX)，也就是 setCircle 的半径
    //    会被 sprite 缩放再乘一次。图集角色的 sprite 放大过，所以要先除掉缩放 ——
    //    直接传 pr 的话巫女的物理半径会变成 15 × 1.7 = 25.5，视觉上没碰到却被打中。
    // 2) offset = 帧宽/2 - 半径（这里的半径是未缩放的）时物理体才与精灵同心。
    //    因为 offset 和 origin 会被一起乘缩放、正好抵消，这条式子在任意缩放下都成立。
    const bodyR = pr / spriteScale;
    this.player.body.setCircle(bodyR, 24 - bodyR, 24 - bodyR);
    this.player.setCollideWorldBounds(true);
    this.player.facing = 'down';
    this.player.invincible = false;
  }

  buildParticles() {
    // 击杀 / 爆炸的火花。优先用 fx-sparks（2 帧的小图），
    // 图集没加载成功时退回程序化的 spark-warm，保证视觉不缺失
    const sparkTex = this.textures.exists('fx-sparks') ? 'fx-sparks' : 'spark-warm';
    this.burstKill = this.add.particles(0, 0, sparkTex, {
      speed: { min: 70, max: 280 }, lifespan: { min: 200, max: 480 },
      scale: { start: 1.2, end: 0 }, alpha: { start: 1, end: 0 },
      blendMode: 'ADD', emitting: false,
    }).setDepth(8000);

    this.burstHit = this.add.particles(0, 0, 'spark-cool', {
      speed: { min: 90, max: 340 }, lifespan: { min: 260, max: 620 },
      scale: { start: 1.5, end: 0 }, alpha: { start: 1, end: 0 },
      blendMode: 'ADD', emitting: false,
    }).setDepth(8000);

    // 子弹拖尾走粒子池：之前是每 50ms 新建一个 Image + 一个 Tween，
    // 三连发时每秒能造出上百个临时对象，是最大的 GC 抖动来源
    this.bulletTrail = this.add.particles(0, 0, 'spark-warm', {
      lifespan: 220,
      scale: { start: 0.75, end: 0.15 },
      alpha: { start: 0.5, end: 0 },
      blendMode: 'ADD', emitting: false,
    }).setDepth(6999);

    // 枪口闪光：每发点一次。开火间隔 290ms、闪光寿命 90ms，
    // 同时最多两三个存活，粒子池扛得住，不用再搭一套 Image 池
    this.muzzleFlash = this.add.particles(0, 0, 'muzzle', {
      lifespan: CONFIG.muzzleFlashMs,
      speed: 0,
      scale: { start: CONFIG.muzzleFlashScale, end: CONFIG.muzzleFlashScale * 0.2 },
      alpha: { start: 1, end: 0 },
      blendMode: 'ADD', emitting: false,
    }).setDepth(7001);

    this.shockRing = this.add.particles(0, 0, 'shockring', {

    this.pressureVignette = this.add.image(W / 2, H / 2, 'vignette')

    this.dangerGlow = this.add.image(W / 2, H / 2, 'vignette-red')

    this.flashWhite = this.add.rectangle(0, 0, W, H, 0xffffff, 1)

    this.flashRed = this.add.rectangle(0, 0, W, H, 0xff1a30, 1)

  /* 主动技能按钮：右下角一个圆钮，点它或按 J 都能开。
     没有主动技能的角色（除巫女以外的所有人）这里直接不创建任何东西。
     点按钮不会误触发滑动移动：滑动要位移超过 24px 才算数，点一下不算 */
  buildActiveSkillButton() {
    if (!this.activeSkill) return;

    const s = this.activeSkill;
    // 摆在场地下沿之外：场地底边在 y=560，按钮中心放 600、半径 36，
    // 整个按钮都落在场地外，不会挡住右下的战斗区域，也躲开了 y=610 的静音按钮
    const x = CONFIG.width - 158, y = CONFIG.height - 40;
    this.activeBtn = { x, y };

    this.activeBtnG = this.add.graphics().setDepth(9000);
    this.activeBtnText = this.add.text(x, y, 'J', {
      fontFamily: UI.FONT, fontSize: '24px', color: '#ffffff', fontStyle: 'bold',
    }).setDepth(9001).setOrigin(0.5);
    // 名字放按钮上方：按钮本身已经贴着画面底边，放下面会被裁掉
    this.activeBtnLabel = this.add.text(x, y - 50, '', {
      fontFamily: UI.FONT, fontSize: '12px', color: '#8fa3b8',
    }).setDepth(9000).setOrigin(0.5);

    const hit = this.add.circle(x, y, 40, 0x000000, 0)
      .setDepth(9002).setInteractive({ useHandCursor: true });
    hit.on('pointerdown', () => { SoundSys.unlock(); this.tryActiveSkill(); });

    this.updateActiveSkillFX();
  }

  /* 主动技能按钮的每帧重绘：次数用尽压暗，形态持续中亮起并显示剩余秒数。
     和 updateSkillFX 一样每帧重画一个 Graphics，比维护一堆 Image + Tween 便宜，
     也不会漏销毁 */
  updateActiveSkillFX() {
    if (!this.activeBtn) return;

    const s = this.activeSkill;
    const g = this.activeBtnG;
    const x = this.activeBtn.x, y = this.activeBtn.y;

    const remain = this.skillActive[s.key] || 0;
    const active = remain > 0;
    const hasCharges = s.charges != null;
    const hasDynCd = !!s.cooldownDynamic;
    const charges = this.skillCharges[s.key] || 0;
    const dynLeft = this.skillCooldownLeft[s.key] || 0;
    const dynTotal = this.skillCooldownTotal[s.key] || 1;

    // 能不能点，两种模式判断方式不同
    const usable = active ? false
      : hasCharges ? charges > 0
      : hasDynCd ? dynLeft <= 0
      : true;

    g.clear();
    g.fillStyle(0x0b1520, 0.78);
    g.fillCircle(x, y, 36);
    g.lineStyle(3, usable ? s.color : 0x33404f, usable ? 1 : 0.75);
    g.strokeCircle(x, y, 36);

    // 外圈进度弧：持续中画剩余 duration，冷却中画剩余冷却。
    // 两者都用 ratio=1 到 0 表示"快好了"，玩家不用记具体数字
    if (active || (hasDynCd && dynLeft > 0)) {
      const ratio = active
        ? Phaser.Math.Clamp(remain / s.duration, 0, 1)
        : Phaser.Math.Clamp(1 - dynLeft / dynTotal, 0, 1);
      g.lineStyle(4, s.color, 1);
      g.beginPath();
      g.arc(x, y, 42, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ratio, false);
      g.strokePath();
    }

    // 大字：可用时是按键提示，持续中显示剩余时长，冷却中显示倒计时，用尽显示叉
    let big;
    if (active) big = (remain / 1000).toFixed(1);
    else if (hasCharges) big = charges > 0 ? 'J' : '×';
    else if (hasDynCd) big = dynLeft > 0 ? (dynLeft / 1000).toFixed(1) : 'J';
    else big = 'J';
    if (this.activeBtnText.text !== big) this.activeBtnText.setText(big);
    this.activeBtnText.setColor(active ? '#ffd0b0' : (usable ? '#ffffff' : '#55697d'));

    // 按钮下方的说明：次数模式显示"剩余次数"，冷却模式显示"下次冷却"
    let label;
    if (hasCharges) label = s.name + '  ' + charges + ' 次';
    else if (hasDynCd) label = s.name + '  冷却 ' + (dynTotal / 1000).toFixed(1) + 's';
    else label = s.name;
    if (this.activeBtnLabel.text !== label) this.activeBtnLabel.setText(label);
    this.activeBtnLabel.setColor(active ? '#ffb08a' : (usable ? '#8fa3b8' : '#55697d'));
  }

  buildPauseButton() {
    const btn = this.add.container(CONFIG.width - 40, 40).setDepth(9000);
    const g = this.add.graphics();
    const draw = (hovered) => {
      g.clear();
      g.fillStyle(0x0b1520, hovered ? 0.9 : 0.7);
      g.fillCircle(0, 0, 22);
      g.lineStyle(2, 0x8fa3b8, 0.9);
      g.strokeCircle(0, 0, 22);
      g.fillStyle(0xffffff, 1);
      g.fillRect(-7, -9, 5, 18);
      g.fillRect(2, -9, 5, 18);
    };
    draw(false);
    btn.add(g);

    const hit = this.add.circle(0, 0, 26, 0x000000, 0).setInteractive({ useHandCursor: true });
    hit.on('pointerover', () => draw(true));
    hit.on('pointerout',  () => draw(false));
    hit.on('pointerdown', () => { SoundSys.unlock(); SoundSys.uiClick(); this.pauseGame(); });
    btn.add(hit);

    this.pauseBtn = btn;
  }

  toggleMute() {
    const m = !SoundSys.isMuted();
    SoundSys.setMuted(m);
    Storage.writeMute(m);
    this.muteBtn.setText(m ? '音效 关' : '音效 开');
    this.muteBtn.setColor(m ? '#55697d' : '#7fffa0');

  setupInput() {
    this.cursors = this.input.keyboard.createCursorKeys();
    this.wasd = this.input.keyboard.addKeys({ up: 'W', down: 'S', left: 'A', right: 'D' });
    this.input.keyboard.addCapture(['SPACE', 'UP', 'DOWN', 'LEFT', 'RIGHT']);

    this.input.keyboard.on('keydown', (e) => {
      const t = this.time.now;
      switch (e.code) {
        case 'ArrowLeft': case 'KeyA':
        case 'ArrowRight': case 'KeyD':
          this.lastHorizPress = t; break;
        case 'ArrowUp': case 'KeyW':
        case 'ArrowDown': case 'KeyS':
          this.lastVertPress = t; break;
        case 'KeyR':
          // 重开要把模式带回去，否则肉鸽局一按 R 就变成无限模式
          if (this.state === 'gameover') this.scene.restart(this.modeData());
          break;
        case 'KeyJ':
          // 主动技能：桌面端按 J，手机端点右下角那个圆钮
          this.tryActiveSkill();
          break;
        // 三选一的键盘快捷方式。手机端点卡片，桌面端按数字键，
        // 两条路都走同一个 pickBuff，不会出现"点了没反应"的分支
        case 'Digit1': case 'Numpad1':
          if (this.state === 'choosing') this.pickBuff(0);
          break;
        case 'Digit2': case 'Numpad2':
          if (this.state === 'choosing') this.pickBuff(1);
          break;
        case 'Digit3': case 'Numpad3':
          if (this.state === 'choosing') this.pickBuff(2);
          break;
        case 'Space': case 'Enter': case 'Escape':
          if (this.state === 'playing') this.pauseGame();
          else if (this.state === 'paused') this.resumeGame();
          else if (this.state === 'gameover' && e.code !== 'Escape') this.scene.restart(this.modeData());
          break;
      }
    });

    // 滑动操作：按下记锚点，滑动超过阈值就换算成朝向，锚点跟着手指走
    const THRESHOLD = 24;
    this.input.on('pointerdown', (p) => {
      if (this.state !== 'playing') return;
      this.touchStart = { x: p.x, y: p.y };
    });
    this.input.on('pointermove', (p) => {
      if (!this.touchStart || this.state !== 'playing') return;
      const dx = p.x - this.touchStart.x;
      const dy = p.y - this.touchStart.y;
      if (Math.abs(dx) < THRESHOLD && Math.abs(dy) < THRESHOLD) return;
      this.touchDir = Math.abs(dx) > Math.abs(dy)
        ? (dx > 0 ? DIRS.right : DIRS.left)
        : (dy > 0 ? DIRS.down : DIRS.up);
      this.touchStart = { x: p.x, y: p.y };
    });
    const clearTouch = () => { this.touchStart = null; this.touchDir = null; };
    this.input.on('pointerup', clearTouch);
    this.input.on('pointerupoutside', clearTouch);
  }

  setupCollisions() {
    // 回调参数顺序：Phaser 在"组 vs 单个精灵"时会先传精灵，所以下面的形参名是准的
    this.physics.add.overlap(this.playerBullets, this.enemies, this.onBulletHitsEnemy, null, this);
    this.physics.add.overlap(this.enemyBullets, this.player, this.onBulletHitsPlayer, null, this);
    this.physics.add.overlap(this.enemies, this.player, this.onEnemyHitsPlayer, null, this);
    this.physics.add.overlap(this.powerups, this.player, this.onPickupPowerup, null, this);
  }

  setupLifecycle() {
    // game.events 是全局事件总线，不随场景销毁，
    // 所以必须在 SHUTDOWN 时摘掉，否则每次重开都会多留一个监听器
    this._onBlur = () => { if (this.state === 'playing') this.pauseGame(); };
    this.game.events.on(Phaser.Core.Events.BLUR, this._onBlur);
    this.events.once(Phaser.Scenes.Events.SHUTDOWN, () => {
      this.game.events.off(Phaser.Core.Events.BLUR, this._onBlur);
      // 清掉未触发的慢动作定时器，并把时间缩放归位，
      // 否则下次进入 Game 场景时会带着 0.35 倍速开局
      clearTimeout(this._slowMoTimer);
      this.resetTimeScale();
      // 退出场景时补一次金币落盘（中途是攒 1 秒写一次的）
      this.flushCoins();
    });
  }

  /* ======================= 慢动作 ======================= */

  resetTimeScale() {
    // 场景 shutdown 期间，Phaser 会先回收 time / tweens / physics 这些子系统，
    // 然后才广播 SHUTDOWN 事件。所以在这个回调里不能直接写 timeScale ——
    // 会抛 "Cannot set properties of null"，整个关闭流程崩掉，
    // 表现就是点"返回主菜单 / 重新开始"之后卡死。三个都判一下空就稳了
    if (this.time) this.time.timeScale = 1;
    if (this.tweens) this.tweens.timeScale = 1;
    if (this.physics && this.physics.world) this.physics.world.timeScale = 1;
  }

  triggerSlowMo(ms) {
    // 三个 timeScale 一起调，才能让物理（移动）、补间（动画）、时钟（定时）
    // 同步慢下来，缺一个就会出现"怪慢了但动画还在跑"的割裂感
    const s = CONFIG.slowMoScale;
    this.time.timeScale = s;
    this.tweens.timeScale = s;
    this.physics.world.timeScale = s;

    clearTimeout(this._slowMoTimer);
    // 用原生 setTimeout 恢复，不走 Phaser 时钟 —— 否则它自己也被慢动作拖长
    this._slowMoTimer = setTimeout(() => this.resetTimeScale(), ms);
  }

  pauseGame() {
    if (this.state !== 'playing') return;
    // 关键修复：如果在慢动作期间暂停，先取消慢动作，避免恢复时时间跳变
    clearTimeout(this._slowMoTimer);
    this.resetTimeScale();

    this.state = 'paused';
    this.physics.world.pause();
    this.time.paused = true;
    this.pauseBtn.setVisible(false);
    this.flushCoins();   // 暂停往往意味着玩家要走开，这时候落盘最保险
    this.showPauseOverlay();
  }

  resumeGame() {
    if (this.state !== 'paused') return;
    this.state = 'playing';
    this.physics.world.resume();
    this.time.paused = false;
    this.pauseBtn.setVisible(true);
    this.hideOverlay();
  }

  clearOverlay() {
    // 先摘补间再销毁：补间若比对象活得久，会在对象销毁后继续写属性
    this.overlay.list.slice().forEach(c => this.tweens.killTweensOf(c));
    this.tweens.killTweensOf(this.overlay);
    this.overlay.removeAll(true);
  }

  showPauseOverlay() {
    this.clearOverlay();

    const W = CONFIG.width, H = CONFIG.height;

    const bg = this.add.graphics();
    bg.fillStyle(0x060b12, 0.55);
    bg.fillRect(0, 0, W, H);
    bg.fillStyle(0x101c2a, 0.35); bg.fillCircle(W/2, H/2 - 30, 480);
    bg.fillStyle(0x16263a, 0.30); bg.fillCircle(W/2, H/2 - 30, 340);
    bg.fillStyle(0x1d304a, 0.28); bg.fillCircle(W/2, H/2 - 30, 220);

    const blocker = this.add.rectangle(0, 0, W, H, 0x000000, 0).setOrigin(0, 0);
    blocker.setInteractive();

    this.overlay.add(bg);
    this.overlay.add(blocker);

    const title = this.add.text(W/2, 120, '暂 停', {
      fontFamily: UI.FONT, fontSize: '52px', color: '#ffe066', fontStyle: 'bold',
    }).setOrigin(0.5);
    title.setShadow(0, 6, '#000000', 12, true, true);
    this.overlay.add(title);

    const sub = this.add.text(W/2, 168, 'P A U S E', {
      fontFamily: UI.MONO, fontSize: '15px', color: '#8fa3b8', letterSpacing: 8,
    }).setOrigin(0.5);
    this.overlay.add(sub);

    const cx = W / 2, cy = H / 2 - 10;
    const bigBtn = this.add.container(cx, cy);
    const g = this.add.graphics();
    const drawBig = (hovered) => {
      g.clear();
      g.fillStyle(0x000000, 0.35);
      g.fillCircle(4, 6, 68);
      g.fillStyle(hovered ? 0x5fa8f0 : 0x4a90d9, 1);
      g.fillCircle(0, 0, 66);
      g.lineStyle(5, 0xffffff, 0.9);
      g.strokeCircle(0, 0, 66);
      g.fillStyle(0xffffff, 1);
      g.fillTriangle(-16, -26, -16, 26, 26, 0);
    };
    drawBig(false);
    bigBtn.add(g);

    const bigHit = this.add.circle(0, 0, 78, 0x000000, 0).setInteractive({ useHandCursor: true });
    bigHit.on('pointerover', () => drawBig(true));
    bigHit.on('pointerout',  () => drawBig(false));
    bigHit.on('pointerdown', () => { SoundSys.unlock(); SoundSys.uiClick(); this.resumeGame(); });
    bigBtn.add(bigHit);
    this.overlay.add(bigBtn);

    const contText = this.add.text(cx, cy + 104, '继 续 游 戏', {
      fontFamily: UI.FONT, fontSize: '20px', color: '#ffffff', fontStyle: 'bold',
    }).setOrigin(0.5);
    this.overlay.add(contText);

    const tipText = this.add.text(cx, cy + 134, '空格 / Esc 也可继续', {
      fontFamily: UI.FONT, fontSize: '14px', color: '#8fa3b8',
    }).setOrigin(0.5);
    this.overlay.add(tipText);


    this.overlay.add(UI.makeButton(this, cx - 150, H - 80, 240, 68, '重 新 开 始', 0x3a5230, 0x577346, () => {
      this.time.paused = false;
      this.physics.world.resume();
      this.state = 'playing';
      this.scene.restart(this.modeData());
    }));
    this.overlay.add(UI.makeButton(this, cx + 150, H - 80, 240, 68, '返 回 主 菜 单', 0x5d452a, 0x8b6a3f, () => {
      this.time.paused = false;
      this.physics.world.resume();
      this.state = 'playing';
      this.scene.start('Menu');
    }));

    this.overlay.setVisible(true).setAlpha(0);
    this.tweens.add({ targets: this.overlay, alpha: 1, duration: 180 });
  }

  update(time, delta) {
    if (this.state !== 'playing') return;

    // 标签页切回来时 delta 可能是几秒，钳一下防止物理瞬间穿模
    const dms = Math.min(delta, 50);
    this.elapsed += dms;

    if (this.difficultyLevel < CONFIG.maxDifficulty && this.elapsed >= this.nextLevelAt) {
      this.difficultyLevel++;
      const d = this.difficultyLevel;
      // 肉鸽模式下越后面的图爬得越快：衰减系数随图序号再加 0.02。
      // 第 1 张图每级间隔 20 秒起衰减，第 3 张图衰减快 1.8 倍 ——
      // 这就是"越往后的图，难度随时间的上涨幅度越大"
      const decay = CONFIG.diffIntervalDecay
        + (this.rogueMode ? ROGUE.diffDecayPerMap * this.rogue.map : 0);
      const interval = Math.max(
        CONFIG.diffIntervalMin,
        CONFIG.diffIntervalBase * Math.exp(-d * decay)
      );
      this.nextLevelAt = this.elapsed + interval;
      SoundSys.levelup();
      this.showDifficultyToast(this.difficultyLevel + 1);
    }

    const dp = this.getDiffParams();

    this.updatePlayer(dms);
    this.updateEnemies(dms, dp);
    this.updateBullets(dms);
    this.updateSpawning(dms, dp);
    this.updateDepth();
    this.updateCombo(dms);
    this.updateLowHpFX();
    this.updateDangerFX();
    this.updatePressureFX(dp);
    this.updateShieldFX();
    this.updatePowerupRing();
    this.updateBuffs(dms);
    this.updateSkills(dms);
    this.updateShockwaves(dms);
    this.updateSkillFX();
    this.updateHeartbeat(dms);

    // 肉鸽：BOSS 状态机 / 伤玩家的冲击波 / 砍影 / 阶段推进。
    // 放在最后是因为它们可能改 state（弹出三选一）——
    // 放前面的话后面那几个 updateXxx 还会拿旧状态多跑一帧
    this.updateBossShocks(dms);
    this.updateBossSlash(dms);
    this.updateBoss(dms);
    this.updateRogue(dms);

    if (this.rogueMode) {
      this.updateRogueHUD();
    } else {
      const lv = this.difficultyLabel(this.difficultyLevel);
      if (lv !== this._lastLevelText) {
        this._lastLevelText = lv;
        this.levelText.setText(lv);
      }
    }
  }

  /* 难度显示统一走这里，避免 HUD 和结算页各写一套导致不一致 */
  difficultyLabel(level) {
    return level >= CONFIG.maxDifficulty ? '难度 MAX' : '难度 ' + (level + 1);
  }

  updatePlayer(dms) {
    const p = this.player;
    if (!p.body.enable) return;

    // 冲锋期间完全接管：位移和贴图都走另一条路径，提前 return。
    // 跳过"斜向按键处理"和"格子吸附"是必须的 —— 冲锋是一条直线，
    // 中途被吸附到格子中线会走成锯齿状
    if (this.skillActive.charge > 0) {
      this.updateCharge(dms);
      this.updatePlayerVisual(dms, true);
      this.playerShadow.setPosition(p.x, p.y + this.shadowDY);
      return;
    }

    let ix = 0, iy = 0;
    if (this.cursors.left.isDown || this.wasd.left.isDown) ix = -1;
    else if (this.cursors.right.isDown || this.wasd.right.isDown) ix = 1;
    if (this.cursors.up.isDown || this.wasd.up.isDown) iy = -1;
    else if (this.cursors.down.isDown || this.wasd.down.isDown) iy = 1;

    if (this.touchDir) { ix = this.touchDir.x; iy = this.touchDir.y; }

    // 斜向按键只保留最后按下的那个轴，避免斜着走导致对不齐网格
    if (ix !== 0 && iy !== 0) {
      if (this.lastHorizPress >= this.lastVertPress) iy = 0;
      else ix = 0;
    }

    // 移速 = 基础 × 角色修正 × 「疾风步」加成 × 肉鸽增幅，全程实时算，技能结束自动落回原速
    const speed = CONFIG.playerSpeed * this.charDef.speedMul
      * (this.skillActive.swiftstep > 0 ? 1.7 : 1)
      * this.rogue.mods.moveMul;
    const snapK = CONFIG.playerSnapStrength;
    const snapMax = CONFIG.playerSnapSpeed;
    let vx = 0, vy = 0;

    if (ix !== 0) {
      vx = ix * speed;
      // 横向移动时把纵向缓慢吸附到最近的格子中线
      vy = Phaser.Math.Clamp((Utils.nearestRowCenter(p.y) - p.y) * snapK, -snapMax, snapMax);
      p.facing = ix < 0 ? 'left' : 'right';
    } else if (iy !== 0) {
      vy = iy * speed;
      vx = Phaser.Math.Clamp((Utils.nearestColCenter(p.x) - p.x) * snapK, -snapMax, snapMax);
      p.facing = iy < 0 ? 'up' : 'down';
    }
    p.body.setVelocity(vx, vy);

    this.updatePlayerVisual(dms, ix !== 0 || iy !== 0);
    this.playerShadow.setPosition(p.x, p.y + this.shadowDY);

    // 射速 = 武器基础间隔 × 角色修正；连射道具和「火力全开」各再打一次对折。
    // 三个系数是相乘不是相加，叠满时也不会出现零间隔的无限射速
    const w = this.weaponDef;
    let fireInterval = w.interval * this.charDef.fireIntervalMul * this.rogue.mods.intervalMul;
    if (this.buffs.rapid > 0) fireInterval *= 0.5;
    if (this.skillActive.overdrive > 0) fireInterval *= 0.5;
    if (this.skillActive.darkform > 0) fireInterval *= 0.5;
    fireInterval = Math.max(60, fireInterval);

    this.fireAccum += dms;
    if (this.fireAccum >= fireInterval) {
      this.fireAccum -= fireInterval;

      const v = DIRS[p.facing];
      this.fireVolley();

      // 开火反馈三件套：枪口闪光 + 音效 + 后坐力微震。
      // 闪光点往前挪到 24px，落在角色轮廓之外，否则会被自己挡住看不见
      this.muzzleFlash.emitParticleAt(p.x + v.x * 24, p.y + v.y * 24, 1);
      SoundSys.shoot();
      this.recoilKick();
    }
  }

  /* 玩家贴图有两个来源：图集角色（巫女）走动画，程序化角色走单帧换图。
     动作优先级：受伤 > 形态 > 施法 > 跑步 / 攻击。
     跑步和攻击是互斥的，而且移动优先：这游戏一直在自动开火，
     要是让开火压过移动，跑步动画就永远看不到了。
     同一段动画不能重复 play —— 每帧重调会把播放头按回第 0 帧，动画看着就像卡死了 */  updatePlayerVisual(dms, moving) {
    const p = this.player;

    // 堕天形态期间给全身打一层暖色。放在最前面，程序化角色也能享受到这个反馈
    const tinted = this.skillActive.darkform > 0;
    if (tinted !== this._darkTinted) {
      this._darkTinted = tinted;
      if (tinted) p.setTint(0xffb080); else p.clearTint();
    }

    const runSheet = this.charDef.sheet ? charRunSheet(this.charDef) : null;
    const sheetOk = !!runSheet && this.textures.exists(runSheet);
    if (!sheetOk) {
      const tex = 'player-' + this.charDef.key + '-' + p.facing;
      if (p.texture.key !== tex) p.setTexture(tex);
      return;
    }

    if (this.playerHurtMs > 0) this.playerHurtMs = Math.max(0, this.playerHurtMs - dms);

    // ---- 动作优先级：受伤 > 形态/冲锋 > 结界/裂地斩 > 移动 / 攻击 ----

    if (this.playerHurtMs > 0) {
      this.playPlayerAnim('hurt');
      return;
    }

    // 形态和冲锋都是"持续状态"，全程保持对应的姿态。
    // 这两套图集的帧序是倒的，正播还是倒播由 CHAR_ANIMS 里的 reverse 决定
    if (this.skillActive.darkform > 0 || this.skillActive.charge > 0) {
      this.skillAnimTick(dms, 'atk3');
      return;
    }

    // 结界、裂地斩、炸药投掷都是"开一下"的技能：
    // 正向播一次施法动作，播完定格在最后一帧
    if (this.skillActive.ward > 0 || this.skillActive.groundcleave > 0 || this.skillActive.throwbomb > 0) {
      this.skillAnimTick(dms, 'atk2');
      return;
    }

    this.playPlayerAnim(moving ? 'run' : 'atk1');
  }

  /* 播放一段循环动画。key 和当前一致时直接跳过 ——
     每帧重调 play() 会把播放头按回第 0 帧，动画看着就像卡死了 */
  playPlayerAnim(act) {
    const p = this.player;
    const key = this.charDef.sheet + '-' + act + '-' + p.facing;
    if (!this.anims.exists(key)) return;
    if (this.playerAnimKey === key) return;
    this.playerAnimKey = key;
    p.anims.play(key, true);
  }

  /* 技能施法动画的手动帧播放器：按这张图集自己的帧率往前走，走到头就定格。
     为什么不用 Phaser 的 anims 系统：anims.stop() 会把 currentFrame 重置回
     第 0 帧，和随后的 setTexture 打架（停止和贴图切换在同一个 tick 里，
     下一帧动画系统还会抢着覆盖一次）；pause() 的行为又取决于动画是否已经播完，
     时序很微妙。手动算帧号 + setTexture 是唯一可控的做法。

     正播还是倒播由 CHAR_ANIMS 里的 reverse 决定，调用方不用管 ——
     图集作者把"完成态"画在了哪一头，是素材本身的性质，不是技能的性质。 */
  skillAnimTick(dms, act) {
    const p = this.player;
    const anims = CHAR_ANIMS[this.charDef.sheet];
    const def = anims ? anims[act] : null;
    if (!def) return;

    if (this.skillAnimMs == null) this.skillAnimMs = 0;
    // 帧计时乘一个倍率：让动画慢下来。这个 dms 是 update 里的真实 delta，
    // 不受 Phaser 的 time.timeScale 影响，所以必须在这里手动降速，
    // 不能指望全屏慢动作顺带把动画也拖慢
    this.skillAnimMs += dms * CONFIG.skillAnimSpeedMul;

    // 时间 → 正向帧号（0 = 动画刚开始，frames-1 = 动画走完）。
    // 封顶到 frames - 1：走到最后一帧就停住，后面的时间再长也不会越过这一行
    const frameDur = 1000 / def.rate;
    const total = def.frames;
    const forward = Math.min(total - 1, Math.floor(this.skillAnimMs / frameDur));
    // 逆向时翻转：正向 0 → 最右（frames-1），正向 frames-1 → 最左（0）
    const idx = def.reverse ? total - 1 - forward : forward;

    // 四个方向在图集里各占一行，行号固定是 下 / 上 / 左 / 右
    const row = { down: 0, up: 1, left: 2, right: 3 }[p.facing] || 0;
    const frame = row * total + idx;
    const marker = def.file + '#' + frame;

    if (this.playerAnimKey === marker) return;
    this.playerAnimKey = marker;

    // 暂停（而不是停止）anims：pause 保留 currentFrame，只停住播放头，
    // 后面的 setTexture 不会被动画系统的下一帧自动覆盖回去
    if (p.anims.isPlaying) p.anims.pause();
    p.setTexture(def.file, frame);
  }

  /* 按当前武器打出一次齐射。子弹的伤害和穿透次数挂在子弹对象上，
     命中逻辑只认子弹上的值，不用回头去查玩家装了什么 */
  fireVolley() {
    const p = this.player;
    const w = this.weaponDef;
    const v = DIRS[p.facing];
    const baseA = Math.atan2(v.y, v.x);

    // 肉鸽增幅：伤害走乘区、穿透走加区。
    // 伤害是"先加后乘"—— 重型弹的 +1 属于弹种修正，增幅属于全局乘区，
    // 顺序反过来会让重型弹吃不到增幅，玩家会觉得那张卡白拿了
    const m = this.rogue.mods;
    const damage = Math.max(1, Math.round(
      (w.damage + (this.skillActive.heavyround > 0 ? 1 : 0)) * m.dmgMul));
    // 武器的 explosive 字段直接透传：鞭炮的子弹就带 explosive，
    // 命中时按 AOE 结算；其余武器是 null，走原来的单体逻辑
