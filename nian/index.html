<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>棋盘枪手 · Board Shooter</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#060b12; }
  #game-root { width:100%; height:100%; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<div id="game-root"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
/* ============================================================================
   棋盘枪手 · 斜俯视四方向自动射击
   ----------------------------------------------------------------------------
   文件结构（从上到下）：
     CONFIG / 敌人表 / 道具表 / 武器表 / 角色表 / 技能表 —— 所有可调数值集中在这里
     Storage                    —— localStorage 读写（最高分 / 静音 / 战绩 / 金币 / 整备）
     BOARD / DIRS / Utils       —— 场地派生常量与坐标换算
     SoundSys                   —— 程序化音效（WebAudio 合成，无音频文件）
     Textures                   —— 程序化纹理生成
     UI                         —— 通用按钮工厂
     GUIDE_DATA                 —— 指南文案数据
     MenuScene / ShopScene / LoadoutScene / GameScene —— 四个场景
   ============================================================================ */

if (typeof Phaser === 'undefined') {
  document.body.innerHTML =
    '<div style="display:flex;align-items:center;justify-content:center;height:100%;' +
    'color:#8fa3b8;font-family:sans-serif;font-size:15px;text-align:center;line-height:1.9">' +
    'Phaser 引擎没能从 CDN 加载成功<br>请检查网络后刷新页面</div>';
  throw new Error('Phaser engine failed to load');
}

/* ============================================================================
   CONFIG —— 想调手感，改这里就够了
   ============================================================================ */
const CONFIG = {
  width: 960,
  height: 640,
  cols: 13,
  rows: 7,
  cell: 64,

  playerSpeed: 205,
  playerSnapStrength: 40,
  playerSnapSpeed: 1800,
  playerInvincibleMs: 1400,
  playerRadius: 17,

  // 注意：射速和玩家弹速现在由 WEAPONS 表按武器决定（下面两个值只剩参考意义，
  // 就是手枪的数值），改武器手感请去 WEAPONS 里改
  playerFireInterval: 290,
  bulletSpeed: 470,
  enemyBulletSpeed: 215,

  enemySpeed: 85,
  enemyFireInterval: 1650,
  spawnInterval: 1700,
  maxEnemies: 4,
  spawnAnimMs: 300,
  enemyWrapMargin: 28,

  enemySpeedFinal: 200,
  enemyFireIntervalFinal: 450,
  spawnIntervalFinal: 400,
  maxEnemiesFinal: 20,

  maxDifficulty: 30,
  diffSaturateTau: 10,

  diffIntervalBase: 20000,
  diffIntervalDecay: 0.05,
  diffIntervalMin: 5000,

  spawnBiasPow: 1.6,
  spawnMinDist: 2,

  comboTimeout: 2500,
  comboStep: 6,
  comboMaxMult: 3.0,

  powerupLifetime: 10000,
  rapidMs: 5000,
  tripleMs: 5000,

  // 图集兵的默认参数（步兵 / 疾风兵 / 散弹兵用这一套）。
  // 三张老图集都是 64×64 帧、角色本体约 17~21 px 宽，比程序化敌人（30~36 px）小一圈，
  // 放大 1.4 倍让体型接近；物理半径同步收到 13（13 × 1.4 ≈ 18.2），
  // 与其他敌人（17）同级 —— 否则玩家会觉得"明明打中了却没中"。
  // 三个特殊兵（铁甲兵 / 追踪炮 / 爆裂兵）本体更大，在 ENEMY_TYPES 里逐条覆盖这三个值。
  // 物理偏移的算法是 offset = 帧宽/2 - 半径（Phaser 内部会把 offset 一起乘缩放，
  // 所以这条式子在任意缩放下都成立，不用按 scale 修正）
  sheetScale: 1.4,
  sheetBodyRadius: 13,
  // 图集兵的程序化投影要按本体尺寸缩小：阴影贴图宽 38px，
  // 原样铺上去比 24px 宽的角色还大，看着像站在一张黑饼上。
  // offsetY 对应本体底边（帧内 y=39，中心 y=32）再乘缩放。
  sheetShadowScale: 0.7,
  sheetShadowOffsetY: 10,

  poolPlayerBullets: 120,
  poolEnemyBullets: 700,
  poolEnemies: 80,
  poolPowerups: 12,

  // 慢动作：只对"击杀特殊敌人"触发，倍率与时长都集中在这里调
  slowMoScale: 0.35,
  slowMoMs: 220,

  // 技能释放：结界 / 堕天形态触发瞬间的全屏慢动作时长。
  // 比击杀稍长一点，让"放技能"这一步有分量，但也不能太长 ——
  // 全屏慢动作期间敌人和玩家一起变慢，超过半秒就会影响正常走位
  skillSlowMoMs: 380,
  // 技能动画本身的播放速度倍率。1 = 原速，越小越慢。
  // 0.4 大约把 500ms 的施法动作拉长到 1.2 秒，兼顾"慢下来"和"不拖沓"
  skillAnimSpeedMul: 0.4,

  vibrateOnHurt: 90,
  vibrateOnHeavyKill: 35,

  shakeOnKill: 0.0045,
  shakeOnPlayerHit: 0.014,

  /* ---- 射击爽感参数（按「开火 / 受击 / 危险 / 放大」四层反馈分组）---- */
  // 枪口闪光：每发都在枪口点一下，是"这一发真的出去了"的第一反馈
  muzzleFlashMs: 90,
  muzzleFlashScale: 1.1,
  // 开火后坐力：极轻的镜头抖动。只在没有更强抖动（击杀 / 受击）在跑时触发，
  // 否则会把击杀那一击的冲击感盖掉
  recoilShakeMs: 34,
  recoilShakeIntensity: 0.0016,
  // 擦弹：敌弹从身边掠过时一声"嗖"，给危险一个听觉预警
  grazeRadius: 46,
  grazeCooldownMs: 130,
  // 危险预警：敌人贴脸时屏幕边缘泛红，越近越浓
  dangerRadius: 120,
  dangerMaxAlpha: 0.18,
  // 压力暗角：同屏敌人越多，四周越暗，把注意力压回战场中心
  pressureMaxAlpha: 0.45,
  // 连击音调：每层连击把击杀音往上抬一点，连击越高声音越尖
  comboPitchStep: 0.035,
  comboPitchMaxStep: 18,

  color: {
    outside:      0x0b1520,
    ground:       0x46603a,
    groundDark:   0x3a5230,
    groundLight:  0x577346,
    fence:        0x8b6a3f,
    fenceDark:    0x5d452a,
    player:       0x4a90d9,
    playerDark:   0x2a5f96,
    playerAccent: 0xffd54a,
    bulletP:      0xffe066,
    bulletE:      0xff5c8a,
    // 特殊兵（铁甲兵 / 追踪炮 / 爆裂兵）的月牙弹单独给一个颜色，
    // 让玩家一眼分得出"这发是特殊兵打过来的"，比形状本身还快
    bulletCrescent: 0xff7ab8,
  },

  // 金币：击杀普通敌人 1 枚、特殊敌人 2 枚，攒够了去商城里解锁东西
  coinNormal: 1,
  coinSpecial: 2,
};

/* ============================================================================
   敌人类型
   ============================================================================ */
const ENEMY_TYPES = {
  // sheet  —— 该兵种用哪张图集渲染（有值就走图集，否则用程序化纹理）
  // sheetShadow —— 图集里本身已经画好投影了，这时要藏掉程序化阴影，否则是双影
  infantry: {
    key: 'infantry', name: '步兵', hp: 1,
    speedMul: 1.00, fireIntervalMul: 1.0, radius: 17,
    color: { main: 0xd94a4a, dark: 0x8f2626, accent: 0xffc2c2 },
    fire: 'single', score: 10, isSpecial: false,
    sheet: 'slime', sheetShadow: true,
  },
  rusher: {
    key: 'rusher', name: '疾风兵', hp: 1,
    speedMul: 1.65, fireIntervalMul: 0, radius: 14,
    color: { main: 0xff9838, dark: 0xa85a1a, accent: 0xffe0b3 },
    fire: 'none', score: 10, isSpecial: false,
    touchDamage: true,
    sheet: 'rusher',
  },
  shotgunner: {
    key: 'shotgunner', name: '散弹兵', hp: 1,
    speedMul: 0.82, fireIntervalMul: 1.6, radius: 17,
    color: { main: 0x4ac2ff, dark: 0x2a6b94, accent: 0xc2e8ff },
    fire: 'spread', score: 10, isSpecial: false,
    sheet: 'shotgunner',
  },
  armored: {
    key: 'armored', name: '铁甲兵', hp: 3,
    speedMul: 0.62, fireIntervalMul: 1.4, radius: 21,
    color: { main: 0xa04ad9, dark: 0x5f2b82, accent: 0xe0c2ff },
    fire: 'single', score: 20, isSpecial: true,
    // 图集 8 列 × 4 行（32 帧），本体约 25×27 px。缩放拉到 1.9 让它在屏幕上
    // 比步兵（约 24 px 宽）明显大一圈；物理半径给 12（×1.9 ≈ 22.8）跟着放大
    sheet: 'armored', sheetScale: 1.9, sheetBodyRadius: 12,
    // 这版图集自带投影（全图唯一的半透明色 rgba(40,41,63,89)，落在脚底 y 38~46）。
    // 再叠一层程序化阴影就成了双影，所以这里藏掉 —— 和 slime / sniper / bomber 一样
    sheetShadow: true,
    crescent: true,
  },
  bomber: {
    key: 'bomber', name: '爆裂兵', hp: 2,
    speedMul: 0.92, fireIntervalMul: 1.2, radius: 18,
    color: { main: 0x4ad96a, dark: 0x2a7a3a, accent: 0xc2ffcc },
    fire: 'single', score: 20, isSpecial: true, onDeath: 'burst',
    // 本体含展开的血翼有 39 px 宽，缩放只给 1.3 就够了（1.3×39 ≈ 51 px），
    // 再大就会糊住半个格子，玩家看不清它往哪走
    sheet: 'bomber', sheetScale: 1.3, sheetBodyRadius: 18,
    sheetShadow: true,
    crescent: true,
  },
  sniper: {
    key: 'sniper', name: '追踪炮', hp: 2,
    speedMul: 0.68, fireIntervalMul: 1.7, radius: 17,
    color: { main: 0xffc93a, dark: 0xa8781a, accent: 0xffeeb3 },
    fire: 'aimed', score: 20, isSpecial: true,
    // 本体 27 px 宽，缩放 1.7 → 约 46 px，是三个特殊兵里最"瘦高"的一个
    sheet: 'sniper', sheetScale: 1.7, sheetBodyRadius: 13,
    sheetShadow: true,
    crescent: true,
  },
};

const ENEMY_ROLLS = [
  { key: 'infantry',    w: 48 },
  { key: 'rusher',      w: 16 },
  { key: 'shotgunner',  w: 19 },
  { key: 'armored',     w: 5 },
  { key: 'bomber',      w: 5 },
  { key: 'sniper',      w: 3 },
];

/* 需要走图集渲染的兵种。键名同时是文件名（assets/<key>.png）和动画前缀（<key>-walk-down） */
const SHEET_KEYS = ['slime', 'rusher', 'shotgunner', 'armored', 'sniper', 'bomber'];

/* 每张图集的"单向帧数"。六张图集单帧都是 64×64，但列数不一样：
   四张 8 列（每向 8 帧），两张 6 列（每向 6 帧）。
   帧数写死会让 6 列的图集被判成"没加载成功"而静默退回矢量贴图。 */
const SHEET_FRAMES_PER_DIR = {
  slime: 8, rusher: 8, shotgunner: 8, armored: 6,
  sniper: 6, bomber: 6,
};

/* 图集规格：8 列 × 4 行 或 6 列 × 4 行，单帧统一 64×64，朝向按行排 下 / 上 / 左 / 右 */
function loadEnemySheets(scene) {
  for (const key of SHEET_KEYS) {
    // 已经加载过就跳过：四个场景的 preload 都会调这里，重复 load 同一个 key
    // 会让 Phaser 重新读一遍文件并刷警告
    if (scene.textures.exists(key)) continue;
    scene.load.spritesheet(key, 'assets/' + key + '.png', {
      frameWidth: 64,
      frameHeight: 64,
    });
  }
}

/* ---- 可玩角色的图集 ----
   排布和敌人图集是同一套（四行按 下 / 上 / 左 / 右），但单帧改成 48×48，
   而且一张图集只装一个动作（敌人是一张图集装"走路"这一件事）。
   帧数必须逐张写死：没有规律可推，写错一列整段动画就会错位。
   reverse: true 表示这张图集的帧序是倒的 —— 作者把"完成态"画在了每行最左边那一帧，
   得反过来播才有"动作逐渐做出来"的感觉。
   atk1 是普通攻击、atk2 是专属技能 1、atk3 是专属技能 2（主动），
   三者的播放时机都在 GameScene 里决定。 */
const CHAR_ANIMS = {
  sorc: {
    run:   { file: 'sorc-run',   frames: 6,  rate: 12, repeat: -1 },
    atk1:  { file: 'sorc-atk1',  frames: 5,  rate: 14, repeat: -1 },
    atk2:  { file: 'sorc-atk2',  frames: 7,  rate: 14, repeat: -1 },
    atk3:  { file: 'sorc-atk3',  frames: 7,  rate: 12, repeat: -1 },
    hurt:  { file: 'sorc-hurt',  frames: 4,  rate: 12, repeat: 0 },
    death: { file: 'sorc-death', frames: 10, rate: 14, repeat: 0 },
  },
  wari: {
    // 勇者的素材叫 Walk，功能就是"跑步"，所以动作名统一叫 run，逻辑里不用分两套
    run:   { file: 'wari-walk',  frames: 8, rate: 12, repeat: -1 },
    atk1:  { file: 'wari-atk1',  frames: 6, rate: 14, repeat: -1 },
    atk2:  { file: 'wari-atk2',  frames: 6, rate: 14, repeat: -1 },
    // 冲锋：这套图集的帧序是倒的，要从右往左播（reverse 由动画注册和帧播放器分别处理）
    atk3:  { file: 'wari-atk3',  frames: 5, rate: 12, repeat: 0, reverse: true },
    hurt:  { file: 'wari-hurt',  frames: 4, rate: 12, repeat: 0 },
    // Death 的 Up 方向素材是 6 帧、其余三个方向只有 5 帧，拼图时已经补齐到 6，
    // 所以这里按 6 写；照抄 5 会让上方向的死亡动画少一帧
    death: { file: 'wari-death', frames: 6, rate: 12, repeat: 0 },
  },
  dwarf: {
    // 矮人：素材只有"行走"和"死亡"两套图集，攻击 / 受伤没有专门的动作，
    // 所以 atk1 / atk2 / hurt 三个动作直接复用 dwarf-walk。
    // 复用方式是"同一个 file、不同动画 key" —— 语义上还是
    // "攻击时播 dwarf-atk1-xxx"，以后有专门素材了改这里的 file 就行。
    // 帧数按实际素材算：两张图集都是 4 列 × 4 行，每向 4 帧。
    // 写成 6 会让 generateFrameNumbers 多算 2 帧、切到下一行的内容上，
    // 动画会突然闪一下
    run:   { file: 'dwarf-walk',  frames: 4, rate: 10, repeat: -1 },
    atk1:  { file: 'dwarf-walk',  frames: 4, rate: 12, repeat: -1 },
    atk2:  { file: 'dwarf-walk',  frames: 4, rate: 12, repeat: -1 },
    hurt:  { file: 'dwarf-walk',  frames: 4, rate: 18, repeat: 0 },
    // 死亡：4 帧 @ 8 fps = 500ms，乘 playPlayerDeath 里的 1.4 缓冲 ≈ 700ms
    death: { file: 'dwarf-death', frames: 4, rate: 8,  repeat: 0 },
  },
};

/* 旧名字：巫女的手动帧播放器按这个名字取图。保留是为了不动那段已经跑通的代码 */
const SORC_ANIMS = CHAR_ANIMS.sorc;

/* 取某个角色"跑步"图集的 key。
   不能直接拼 charDef.sheet + '-run' —— 巫女那张图集叫 sorc-run，
   勇者那张叫 wari-walk（素材作者用词就不统一），拼出来会拿到一个不存在的 key，
   然后整个角色静默退回程序化纹理。图集缺失时返回 null，调用方据此降级 */
function charRunSheet(charDef) {
  const anims = CHAR_ANIMS[charDef.sheet];
  return (anims && anims.run) ? anims.run.file : null;
}

/* 各张角色图集的"一帧大小"。
   ⚠️ 这里必须和素材实际尺寸一致 —— 写错了就会切出"上半身叠着下半身"
   这种错位（第一帧取满 48×48 时会纵向跨到第二帧一半）。
   量法：把图片拖进看图软件，宽度 ÷ 列数、高度 ÷ 行数 就是一帧的尺寸。
   没列在这张表里的图集，按 48×48 处理（巫女、勇者都是这个尺寸） */
const CHAR_SHEET_DIMS = {
  'dwarf-walk':  { w: 32, h: 32 },
  'dwarf-death': { w: 32, h: 32 },
};

function loadCharSheets(scene) {
  for (const anims of Object.values(CHAR_ANIMS)) {
    for (const a of Object.values(anims)) {
      if (scene.textures.exists(a.file)) continue;
      const d = CHAR_SHEET_DIMS[a.file] || { w: 48, h: 48 };
      scene.load.spritesheet(a.file, 'assets/' + a.file + '.png', {
        frameWidth: d.w,
        frameHeight: d.h,
      });
    }
  }
}

/* 新增的四张图：爆炸、火花、鞭炮、炸药。
   帧尺寸 = 图片宽 ÷ 列数、图片高 ÷ 行数，必须和素材实际尺寸一致。
   ⚠️ 这里曾经把前三张按 16×16 切，而它们的单帧实际是 32×32 ——
   96×96 的鞭炮会被切成 6×6 共 36 帧，每帧只取到原图的四分之一，
   子弹显示成一块认不出来的红色碎片。改这张表之前先用工具量一遍图片尺寸。 */
const FX_SHEETS = {
  'fx-explosion':       { w: 32, h: 32 },  // 96×64 → 3 列 × 2 行 = 6 帧，从中心扩散到消散
  'fx-sparks':          { w: 32, h: 32 },  // 64×32 → 2 列 × 1 行 = 2 帧
  'item-dynamite':      { w: 32, h: 32 },  // 96×96 → 3 列 × 3 行 = 9 帧（鞭炮引线闪动）
  'item-dynamite-pack': { w: 32, h: 32 },  // 96×96 → 3 列 × 3 行 = 9 帧（炸药包引线闪动）
};

/* 图集类子弹（鞭炮 / 炸药）的显示参数。
   为什么需要这张表：程序化子弹是 16×16 的圆（内容撑满 16 px），
   而鞭炮 / 炸药的素材单帧是 32×32、内容只有 20~24 px ——
   按 1:1 直接显示会比普通子弹大一圈，缩放后才和手枪弹一个量级。
   angleOffset 是"素材本身画歪了多少"的补偿：鞭炮是斜着画的
   （实测主轴 -45.7°，即引线朝右上），不补的话朝右打出去的鞭炮
   会一直保持右上的姿态，看着像在侧着飘。炸药包接近正方形，不用补。 */
const BULLET_LOOK = {
  'item-dynamite':      { scale: 0.70, angleOffset: Math.PI / 4 },
  'item-dynamite-pack': { scale: 0.75, angleOffset: 0 },
};

/* 两种爆炸特效的适配参数。
   contentW 是"素材里真正有像素的那部分宽度"，不是帧宽 ——
   fx-explosion 最盛的一帧内容撑满 32 px，fx-sparks 的星芒只占中间 13 px，
   32 px 的帧里一大半是空白。用帧宽当基准算缩放，火花会缩得比判定圈小一半，
   看着像"炸了个寂寞"。cover 决定视觉圈比判定圈大还是小：
   爆炸要压过判定范围一点才有打击感，火花是发散的星芒，小一点反而自然。 */
const FX_FIT = {
  explosion: { anim: 'fx-explosion-anim', tex: 'fx-explosion', contentW: 32, cover: 1.15 },
  sparks:    { anim: 'fx-sparks-anim',    tex: 'fx-sparks',    contentW: 13, cover: 0.90 },
};

function loadFxSheets(scene) {
  for (const [key, d] of Object.entries(FX_SHEETS)) {
    if (scene.textures.exists(key)) continue;
    scene.load.spritesheet(key, 'assets/' + key + '.png', {
      frameWidth: d.w,
      frameHeight: d.h,
    });
  }
}

/* ============================================================================
   BOSS —— 骷髅王（Foozle Lucifer Skeleton King）
   ----------------------------------------------------------------------------
   排布和其它图集完全一致（四行 下 / 上 / 左 / 右），但单帧尺寸逐张不同 ——
   这包作者按"这个动作需要多大画布"裁图：
     Idle / Walk / Jump / Land / Hurt / Death   → 48×48

                                                    正好是 48 帧上下各留 8 的居中结果）
     Attack02（旋转斩，白弧甩得很开）            → 128×128
   所以帧尺寸必须逐张写。拿 48 去切 64 的图会切出半个身子。
   ============================================================================ */

  'boss-land':  { w: 48,  h: 48 },

};

/* 每个动作"地面线在帧内的 y"。
   素材自带投影（全图唯一的半透明色，alpha=131），量出投影下沿就是地面线：
   48 帧落在 y=40、64 帧 y=48、128 帧 y=80。
   originY 取 groundY / 帧高，保证所有动作的脚踩在同一个世界坐标上 ——
   不这么做，boss 从待机切到攻击会整体下沉 8px，3 倍缩放下就是 24px 的跳变。 */
const BOSS_GROUND_Y = {
  'boss-idle': 40, 'boss-walk': 40, 'boss-jump': 40, 'boss-land': 40,
  'boss-hurt': 40, 'boss-death': 40,
  'boss-atk1': 48, 'boss-atk3': 48,
  'boss-atk2': 80,
};

function loadBossSheets(scene) {
  for (const a of Object.values(BOSS_ANIMS)) {
    if (scene.textures.exists(a.file)) continue;
    const d = BOSS_SHEET_DIMS[a.file];
    scene.load.spritesheet(a.file, 'assets/' + a.file + '.png', {
      frameWidth: d.w, frameHeight: d.h,
    });
  }
}

/* 商店分类 → 数据表，UI 和存档校验共用一张表，避免两边写两套 */
const SHOP_CATEGORIES = {
  character: { label: '角色', table: CHARACTERS },
  weapon:    { label: '武器', table: WEAPONS },
  skill:     { label: '技能', table: SKILLS },
};

/* ============================================================================
   Storage —— localStorage 统一收口，读写都吞异常
   （file:// 下或隐私模式下 localStorage 可能直接抛错，不能让它打断游戏）
   ============================================================================ */
const Storage = {
  KEY_BEST: 'boardShooterBest',
  KEY_MUTE: 'boardShooterMute',
  KEY_HISTORY: 'boardShooterHistory',
  KEY_COINS: 'boardShooterCoins',
  KEY_LOADOUT: 'boardShooterLoadout',
  HISTORY_MAX: 5,

  _get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
  _set(key, v) { try { localStorage.setItem(key, v); } catch (e) {} },

  readBest() { return Number(this._get(this.KEY_BEST)) || 0; },
  writeBest(v) { this._set(this.KEY_BEST, String(v)); },

  readMute() { return this._get(this.KEY_MUTE) === '1'; },
  writeMute(v) { this._set(this.KEY_MUTE, v ? '1' : '0'); },

  readHistory() {
    try { return JSON.parse(this._get(this.KEY_HISTORY) || '[]'); }
    catch (e) { return []; }
  },
  pushHistory(entry) {
    const list = this.readHistory();
    list.unshift(entry);
    while (list.length > this.HISTORY_MAX) list.pop();
    this._set(this.KEY_HISTORY, JSON.stringify(list));
  },

  readCoins() { return Math.max(0, Number(this._get(this.KEY_COINS)) || 0); },
  writeCoins(v) { this._set(this.KEY_COINS, String(Math.max(0, Math.floor(v)))); },

  /* 整备存档：角色 / 武器 / 两个技能槽 / 已解锁清单。
     存档结构以后还会变，所以读的时候逐字段兜底 —— 只要有一个字段不认识，
     就退回默认值，绝不能因为一份旧存档让整个商城打不开 */
  readLoadout() {
    const fresh = () => JSON.parse(JSON.stringify(DEFAULT_LOADOUT));
    const raw = this._get(this.KEY_LOADOUT);
    if (!raw) return fresh();

    let obj = null;
    try { obj = JSON.parse(raw); } catch (e) { obj = null; }
    if (!obj || typeof obj !== 'object') return fresh();

    const out = fresh();

    // 先还原"已拥有"，再校验"已装备"。顺序反了会读出"装备着但没买过"的死状态
    if (obj.owned && typeof obj.owned === 'object') {
      for (const cat in SHOP_CATEGORIES) {
        const list = obj.owned[cat];
        if (!Array.isArray(list)) continue;
        for (const id of list) {
          if (SHOP_CATEGORIES[cat].table[id] && out.owned[cat].indexOf(id) < 0) {
            out.owned[cat].push(id);
          }
        }
      }
    }

    const owns = (cat, id) => out.owned[cat].indexOf(id) >= 0;
    if (CHARACTERS[obj.character] && owns('character', obj.character)) out.character = obj.character;
    if (WEAPONS[obj.weapon] && owns('weapon', obj.weapon)) out.weapon = obj.weapon;

    if (Array.isArray(obj.skills)) {
      for (let i = 0; i < SKILL_SLOTS; i++) {
        const k = obj.skills[i];
        // 专属技能不许进槽位：它跟着角色走，塞进槽里会变成双倍效果
        if (k && SKILLS[k] && !SKILLS[k].innate && owns('skill', k)) out.skills[i] = k;
      }
    }
    return out;
  },
  writeLoadout(obj) { this._set(this.KEY_LOADOUT, JSON.stringify(obj)); },
};

/* ============================================================================
   场地派生常量
   ============================================================================ */
const BOARD = (() => {
  const w = CONFIG.cols * CONFIG.cell;
  const h = CONFIG.rows * CONFIG.cell;
  return {
    w, h,
    x: (CONFIG.width - w) / 2,
    y: (CONFIG.height - h) / 2 + 16,
  };
})();

const DIRS = {
  up:    { x: 0,  y: -1, name: 'up' },
  down:  { x: 0,  y: 1,  name: 'down' },
  left:  { x: -1, y: 0,  name: 'left' },
  right: { x: 1,  y: 0,  name: 'right' },
};

/* ============================================================================
   坐标换算工具
   逻辑层一律用 (col, row)，渲染层才转像素，两边不混算
   ============================================================================ */
const Utils = {
  colCenter: c => BOARD.x + c * CONFIG.cell + CONFIG.cell / 2,
  rowCenter: r => BOARD.y + r * CONFIG.cell + CONFIG.cell / 2,

  nearestColCenter(x) {
    return this.colCenter(
      Phaser.Math.Clamp(Math.floor((x - BOARD.x) / CONFIG.cell), 0, CONFIG.cols - 1));
  },
  nearestRowCenter(y) {
    return this.rowCenter(
      Phaser.Math.Clamp(Math.floor((y - BOARD.y) / CONFIG.cell), 0, CONFIG.rows - 1));
  },

  insideBoard(x, y, margin = 0) {
    return x >= BOARD.x - margin && x <= BOARD.x + BOARD.w + margin &&
           y >= BOARD.y - margin && y <= BOARD.y + BOARD.h + margin;
  },

  lerp: (a, b, t) => a + (b - a) * t,

  weightedPick(rolls) {
    let total = 0;
    for (const r of rolls) total += r.w;
    let roll = Math.random() * total;
    for (const r of rolls) {
      roll -= r.w;
      if (roll <= 0) return r.key;
    }
    return rolls[rolls.length - 1].key;
  },

  vibrate(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
  },
};

/* ============================================================================
   音效 —— 全部用 WebAudio 现场合成，不依赖任何音频文件
   ============================================================================ */
const SoundSys = (() => {
  let ctx = null, master = null, muted = false;
  let noiseBuffer = null;

  function ensure() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.5;
    master.connect(ctx.destination);
    return ctx;
  }

  function installUnlockOnFirstGesture() {
    const unlock = () => {
      SoundSys.unlock();
      window.removeEventListener('pointerdown', unlock);
      window.removeEventListener('keydown', unlock);
      window.removeEventListener('touchstart', unlock);
    };
    window.addEventListener('pointerdown', unlock);
    window.addEventListener('keydown', unlock);
    window.addEventListener('touchstart', unlock);
  }

  function unlock() {
    const c = ensure();
    if (c && c.state === 'suspended') c.resume();
  }
  function setMuted(m) { muted = m; }
  function isMuted() { return muted; }

  function blip(opt) {
    if (muted) return;
    const c = ensure();
    if (!c || c.state !== 'running') return;
    const t0 = c.currentTime + (opt.delay || 0);
    const dur = opt.dur || 0.12;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = opt.type || 'square';
    osc.frequency.setValueAtTime(opt.freq, t0);
    if (opt.sweep) osc.frequency.exponentialRampToValueAtTime(Math.max(1, opt.sweep), t0 + dur);
    const peak = opt.gain != null ? opt.gain : 0.3;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }

  return {
    unlock, setMuted, isMuted, installUnlockOnFirstGesture,

    uiClick() { blip({ freq: 660, type: 'square', dur: 0.05, gain: 0.15, sweep: 880 }); },
    shoot() { blip({ freq: 880, type: 'square', dur: 0.06, gain: 0.16, sweep: 660 }); },
    enemyShoot() { blip({ freq: 300, type: 'triangle', dur: 0.05, gain: 0.045, sweep: 240 }); },
    // step 传当前连击层数：越高音调越尖，连击的"涨潮感"靠它撑起来
    kill(step = 0) {
      const f = 560 * Math.pow(1 + CONFIG.comboPitchStep, Math.min(step, CONFIG.comboPitchMaxStep));
      blip({ freq: f, type: 'square', dur: 0.12, gain: 0.22, sweep: f * 0.21 });
    },
    // 擦弹：一声很轻的高频"嗖"。音量压到极低，因为它触发频繁，
    // 太响会盖过开火和击杀这两个主音
    graze() { blip({ freq: 2100, type: 'sine', dur: 0.07, gain: 0.05, sweep: 900 }); },
    heavyKill() { blip({ freq: 320, type: 'sawtooth', dur: 0.18, gain: 0.24, sweep: 80 }); },
    // 结界反弹：短促上扬的金属声。要能和"嗖"的擦弹声、闷响的受伤声区分开，
    // 否则玩家分不清这一下是躲过去了还是被弹回去了
    deflect() { blip({ freq: 1250, type: 'square', dur: 0.07, gain: 0.14, sweep: 1750 }); },
    hurt() { blip({ freq: 220, type: 'sawtooth', dur: 0.28, gain: 0.3, sweep: 55 }); },
    comboBreak() { blip({ freq: 240, type: 'triangle', dur: 0.14, gain: 0.12, sweep: 140 }); },
    pickup() {
      blip({ freq: 720, type: 'square', dur: 0.07, gain: 0.18, sweep: 1080 });
      blip({ freq: 1080, type: 'square', dur: 0.1, gain: 0.16, delay: 0.06 });
    },
    heartbeat() {
      blip({ freq: 68, type: 'sine', dur: 0.14, gain: 0.45, sweep: 42 });
      blip({ freq: 58, type: 'sine', dur: 0.18, gain: 0.32, sweep: 36, delay: 0.18 });
    },
    breathe() {
      if (muted) return;
      const c = ensure();
      if (!c || c.state !== 'running') return;
      if (!noiseBuffer) {
        const len = Math.floor(c.sampleRate * 0.5);
        noiseBuffer = c.createBuffer(1, len, c.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      }
      const src = c.createBufferSource();
      src.buffer = noiseBuffer;
      const filt = c.createBiquadFilter();
      filt.type = 'bandpass';
      filt.frequency.value = 720;
      filt.Q.value = 1.4;
      const g = c.createGain();
      const t0 = c.currentTime;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.14, t0 + 0.12);
      g.gain.linearRampToValueAtTime(0, t0 + 0.42);
      src.connect(filt); filt.connect(g); g.connect(master);
      src.start(t0); src.stop(t0 + 0.5);
    },
    start() {
      blip({ freq: 440, type: 'square', dur: 0.08, gain: 0.18 });
      blip({ freq: 660, type: 'square', dur: 0.08, gain: 0.18, delay: 0.09 });
      blip({ freq: 880, type: 'square', dur: 0.14, gain: 0.2, delay: 0.18 });
    },
    over() {
      blip({ freq: 440, type: 'sawtooth', dur: 0.18, gain: 0.28, sweep: 110 });
      blip({ freq: 220, type: 'sawtooth', dur: 0.32, gain: 0.26, sweep: 70, delay: 0.16 });
    },
    levelup() {
      blip({ freq: 660, type: 'triangle', dur: 0.1, gain: 0.18 });
      blip({ freq: 990, type: 'triangle', dur: 0.14, gain: 0.2, delay: 0.1 });
    },
  };
})();

/* ============================================================================
   Textures —— 原型阶段全部程序化绘制，不依赖外部美术资源
   ============================================================================ */
const Textures = {
  ensure(scene) {
    if (scene.textures.exists('player-gunner-down')) return;
    const C = CONFIG.color;
    const DIR_NAMES = ['down', 'up', 'left', 'right'];

    // 每个角色生成一套贴图，键名是 player-<角色key>-<朝向>。
    // 菜单和游戏里都按角色 key 取图，换角色就是换一套颜色，不用改逻辑
    for (const ch of Object.values(CHARACTERS)) {
      DIR_NAMES.forEach(dir => {
        this.makeChar(scene, 'player-' + ch.key + '-' + dir,
          ch.color.main, ch.color.dark, ch.color.accent, dir, CONFIG.playerRadius);
      });
    }

    for (const t of Object.values(ENEMY_TYPES)) {
      DIR_NAMES.forEach(dir => {
        this.makeChar(scene,
          'enemy-' + t.key + '-' + dir,
          t.color.main, t.color.dark, t.color.accent,
          dir, t.radius);
      });
    }

    this.makeBullet(scene, 'bullet-p', C.bulletP);
    // 巫女的火弹。尺寸必须和普通子弹一样是 16×16 ——
    // 子弹池里两种弹共用同一套物理体偏移，尺寸不一致会有一方判定错位
    this.makeFireBullet(scene, 'bullet-fire');
    // 勇者的剑气。同样保持 16×16，理由和火弹一样
    this.makeSlash(scene, 'bullet-slash');
    // 矮人的两种爆炸物。尺寸也都保持 16×16，共用同一套物理体偏移
    this.makeFirecracker(scene, 'bullet-firecracker');
    this.makeBomb(scene, 'bullet-bomb');
    // 爆炸环：橙色描边圆，命中触发 AOE 时按半径向外扩散
    this.makeRing(scene, 'explosion-ring', 0xff7a2a);
    this.makeBullet(scene, 'bullet-e', C.bulletE);
    this.makeCrescent(scene, 'bullet-e-crescent', C.bulletCrescent);
    this.makeDot(scene, 'spark', 10, 0xffffff);
    this.makeDot(scene, 'spark-warm', 10, 0xffc860);
    this.makeDot(scene, 'spark-cool', 10, 0x7fd4ff);
    this.makeShadow(scene, 'shadow');
    this.makeLife(scene, 'life', 0xff5c6e);
    this.makeLife(scene, 'life-off', 0x33404f);
    this.makeGlow(scene, 'muzzle', 0xffe066);
    this.makeRing(scene, 'shockring', 0xffffff);
    this.makeVignette(scene, 'vignette', '0,0,0');
    this.makeVignette(scene, 'vignette-red', '255,32,22');
    // BOSS 劈砍打出的砍影
    this.makeBossSlash(scene, 'boss-slash');

    for (const key of Object.keys(POWERUP_TYPES)) {
      this.makePowerup(scene, 'powerup-' + key, POWERUP_TYPES[key].color, key);
    }
  },

  makeChar(scene, key, main, dark, accent, dir, radius = 17) {
    const S = 48, cx = S / 2, cy = S / 2;
    const g = scene.make.graphics({ x: 0, y: 0, add: false });
    const v = DIRS[dir];
    const dR = radius - 17;

    g.fillStyle(0x101a24, 1); g.fillCircle(cx, cy, 18 + dR);
    g.fillStyle(dark, 1);     g.fillCircle(cx, cy, 16 + dR);
    g.fillStyle(main, 1);     g.fillCircle(cx, cy, 13 + dR);

    g.fillStyle(accent, 1);
    if (v.x !== 0) {
      const startX = cx + (v.x > 0 ? (13 + dR) - 4 : -(13 + dR) - 8);
      g.fillRect(startX, cy - 4, 12, 8);
    } else {
      const startY = cy + (v.y > 0 ? (13 + dR) - 4 : -(13 + dR) - 8);
      g.fillRect(cx - 4, startY, 8, 12);
    }

    const eye = (ex, ey) => {
      g.fillStyle(0xffffff, 1); g.fillCircle(ex, ey, 3.2);
      g.fillStyle(0x101a24, 1); g.fillCircle(ex + v.x * 1.1, ey + v.y * 1.1, 1.7);
    };
    if (dir === 'down')       { eye(cx - 5, cy + 2); eye(cx + 5, cy + 2); }
    else if (dir === 'left')  { eye(cx - 7, cy - 1); }
    else if (dir === 'right') { eye(cx + 7, cy - 1); }

    g.generateTexture(key, S, S);
    g.destroy();
  },

  makeBullet(scene, key, color) {
    const S = 16, c = S / 2;
    const g = scene.make.graphics({ x: 0, y: 0, add: false });
    g.fillStyle(color, 0.22); g.fillCircle(c, c, 8);
    g.fillStyle(color, 0.60); g.fillCircle(c, c, 5.5);
    g.fillStyle(color, 1);    g.fillCircle(c, c, 4);
    g.fillStyle(0xffffff, 1); g.fillCircle(c, c, 2);
    g.generateTexture(key, S, S);
    g.destroy();
  },

  /* 火弹：外焰 → 主焰 → 弹芯三层同心圆，从橙到米白逐层变亮。
     形状和普通子弹完全一致（同样是 16×16 的圆），只靠配色区分 ——
     在满屏弹幕里，颜色比形状快得多，"这发是我的火弹"一眼就能认出来 */
  makeFireBullet(scene, key) {
    const S = 16, c = S / 2;
    const g = scene.make.graphics({ x: 0, y: 0, add: false });
    g.fillStyle(0xff5a1a, 0.30); g.fillCircle(c, c, 8);
    g.fillStyle(0xff8a2a, 0.70); g.fillCircle(c, c, 5.5);
    g.fillStyle(0xffc84a, 1);    g.fillCircle(c, c, 4);
    g.fillStyle(0xfff4c2, 1);    g.fillCircle(c, c, 2);
    g.generateTexture(key, S, S);
    g.destroy();
  },

  /* 剑气：横向的梭形（两端收尖、中间厚），三层从外晕到亮芯逐层收窄。
     为什么不用弯月：弯月的"肚子"偏在一侧，飞行时看着像在侧着滑行；
     剑气要的是"笔直劈出去的一道"，所以左右对称、跟着速度方向旋转。
     尺寸同样必须是 16×16 —— 玩家弹池共用同一套物理体偏移 */
  makeSlash(scene, key) {
    const S = 16, c = S / 2;
    const g = scene.make.graphics({ x: 0, y: 0, add: false });

    // 外晕：整条梭形，最宽处 ±6
    g.fillStyle(0x5fc8ff, 0.30);
    g.fillTriangle(0.5, c, c, c - 6, c, c + 6);
    g.fillTriangle(S - 0.5, c, c, c - 6, c, c + 6);
    // 主体
    g.fillStyle(0x9fe8ff, 0.85);
    g.fillTriangle(2, c, c, c - 4, c, c + 4);
    g.fillTriangle(S - 2, c, c, c - 4, c, c + 4);
    // 亮芯：一条几乎贴中线的白线，"锋"的感觉全靠它
    g.fillStyle(0xffffff, 1);
    g.fillTriangle(5, c, c, c - 1.8, c, c + 1.8);
    g.fillTriangle(S - 5, c, c, c - 1.8, c, c + 1.8);

    g.generateTexture(key, S, S);
    g.destroy();
  },

  /* 鞭炮：一颗红色的小鞭炮，顶上有一根黄色引线。
     和火弹、剑气一样，尺寸固定 16×16，共用同一套物理体偏移 */
  makeFirecracker(scene, key) {
    const S = 16, c = S / 2;
    const g = scene.make.graphics({ x: 0, y: 0, add: false });
    g.fillStyle(0xff3a1a, 0.25); g.fillCircle(c, c, 8);
    g.fillStyle(0xa02020, 1);    g.fillRect(c - 4, c - 3, 8, 7);
    g.fillStyle(0xff5a3a, 1);    g.fillRect(c - 3, c - 2, 6, 4);
    g.fillStyle(0xffd54a, 1);    g.fillRect(c - 1, c - 6, 2, 3);
    g.fillStyle(0xffffff, 1);    g.fillCircle(c, c - 6, 1);
    g.generateTexture(key, S, S);
    g.destroy();
  },

  /* 炸药：比鞭炮更粗的红色包裹，中间缠着两道黑箍。
     同尺寸 16×16，飞出去时看着更"重" */
  makeBomb(scene, key) {
    const S = 16, c = S / 2;
    const g = scene.make.graphics({ x: 0, y: 0, add: false });
    g.fillStyle(0xff3a1a, 0.25); g.fillCircle(c, c, 8);
    g.fillStyle(0xa02020, 1);    g.fillRect(c - 5, c - 4, 10, 9);
    g.fillStyle(0xff5a3a, 1);    g.fillRect(c - 4, c - 3, 8, 5);
    g.fillStyle(0x101a24, 1);
    g.fillRect(c - 5, c - 3, 10, 1.5);
    g.fillRect(c - 5, c + 1, 10, 1.5);
    g.fillStyle(0xffd54a, 1);    g.fillRect(c - 1, c - 7, 2, 3);
    g.fillStyle(0xffffff, 1);    g.fillCircle(c, c - 7, 1.2);
    g.generateTexture(key, S, S);
    g.destroy();
  },

  /* 月牙弹：三个特殊兵（铁甲兵 / 追踪炮 / 爆裂兵）的专属弹型。
     "外圆挖掉内圆"用 destination-out 做：先 source-over 填外圆（带 shadowBlur 出辉光），
     再切 destination-out 用内圆把它啃掉一块，剩下弯月。
     不用 nonzero 绕数法是因为 ctx.arc(..., true) 画整圆时浏览器行为不一致，
     挖空结果时有时无；destination-out 是明确无歧义的。
     尺寸必须保持 16×16：敌弹池里圆弹和月牙弹共用同一套物理体偏移 */
  makeCrescent(scene, key, color) {
    const S = 16;
    const tex = scene.textures.createCanvas(key, S, S);
    if (!tex) return;
    const ctx = tex.getContext();
    const hex = '#' + color.toString(16).padStart(6, '0');

    // 外圆 (6.4,8) r=7.1，内圆 (3.9,8) r=5.0，两个圆心只错开 2.5px，
    // 剩下"肚子朝右、两只角朝左"的弯月，最厚处约 4.6px。
    // 肚子外缘落在 x≈13.5，和物理体（半径 5 的同心圆，右缘 x=13）几乎齐平，
    // 判定不会掉进月牙中间的空心里
    const O = { x: 6.4, y: 8, r: 7.1 };
    const P = { x: 3.9, y: 8, r: 5.0 };

    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowColor = hex;
    ctx.shadowBlur = 5;
    ctx.fillStyle = hex;
    ctx.beginPath();
    ctx.arc(O.x, O.y, O.r, 0, Math.PI * 2, false);
    ctx.fill();

    // 挖空：内圆的阴影必须关掉，否则 destination-out 会连阴影一起参与运算
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(P.x, P.y, P.r, 0, Math.PI * 2, false);
    ctx.fill();

    ctx.globalCompositeOperation = 'source-over';
    tex.refresh();
  },

  /* BOSS 的砍影：一道大月牙，朝飞行方向张开。
     为什么不从 boss 图集里把 Attack01 第 3 帧的白月牙抠出来用 ——
     那帧里月牙和角色是叠在一起的，抠出来必然带着半个身子。
     所以照素材的配色（亮白 + 金色外缘）用 Canvas 画一个同风格的大月牙。
     128×128 的画布，外圆 r=52、内圆偏左 24，剩下"肚子朝右"的弯月；
     飞行时 setRotation(角度) 就能让它头朝哪飞哪 */
  makeBossSlash(scene, key) {
    const S = 128;
    const tex = scene.textures.createCanvas(key, S, S);
    if (!tex) return;
    const ctx = tex.getContext();
    const cx = S / 2, cy = S / 2;

    // 外圈金色辉光
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowColor = 'rgba(255,205,80,0.95)';
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#ffcf50';
    ctx.beginPath();
    ctx.arc(cx, cy, 52, 0, Math.PI * 2, false);
    ctx.fill();

    // 挖空内圆做出月牙。内圆的阴影必须归零，
    // 否则 destination-out 会把阴影也算进去，月牙边缘会糊成一圈灰
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(cx - 24, cy, 44, 0, Math.PI * 2, false);
    ctx.fill();

    // 再补一层更亮的白芯，让月牙有"能量体"的层次
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(cx, cy, 46, 0, Math.PI * 2, false);
    ctx.fill();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(cx - 22, cy, 42, 0, Math.PI * 2, false);
    ctx.fill();

    ctx.globalCompositeOperation = 'source-over';
    tex.refresh();
  },

  makeDot(scene, key, size, color) {
    const g = scene.make.graphics({ x: 0, y: 0, add: false });
    g.fillStyle(color, 1);
    g.fillCircle(size / 2, size / 2, size / 2);
    g.generateTexture(key, size, size);
    g.destroy();
  },

  makeShadow(scene, key) {
    const W = 38, H = 15;
    const g = scene.make.graphics({ x: 0, y: 0, add: false });
    g.fillStyle(0x000000, 0.28);
    g.fillEllipse(W / 2, H / 2, W, H);
    g.generateTexture(key, W, H);
    g.destroy();
  },

  /* 径向柔光：Graphics 画不了渐变，用逐层缩小的低透明度圆叠出近似效果。
     枪口闪光就是靠它，比纯色圆点像"光"得多 */
  makeGlow(scene, key, color) {
    const S = 48, c = S / 2;
    const g = scene.make.graphics({ x: 0, y: 0, add: false });
    for (let i = 8; i >= 1; i--) {
      g.fillStyle(color, 0.13);
      g.fillCircle(c, c, (i / 8) * (S / 2 - 1));
    }
    g.fillStyle(0xffffff, 0.85);
    g.fillCircle(c, c, 4);
    g.generateTexture(key, S, S);
    g.destroy();
  },

  /* 冲击波环：纹理保持小尺寸，靠粒子自身的缩放拉到想要的大小 */
  makeRing(scene, key, color) {
    const S = 64, c = S / 2;
    const g = scene.make.graphics({ x: 0, y: 0, add: false });
    g.lineStyle(7, color, 0.9);
    g.strokeCircle(c, c, S / 2 - 4);
    g.lineStyle(2.5, 0xffffff, 1);
    g.strokeCircle(c, c, S / 2 - 4);
    g.generateTexture(key, S, S);
    g.destroy();
  },

  /* 径向暗角：Graphics 的四角渐变拼不出平滑的径向衰减，直接用 Canvas 画一张。
     color 传 'r,g,b' 字符串 —— 黑色做压力暗角，红色做危险预警 */
  makeVignette(scene, key, color) {
    const W = CONFIG.width, H = CONFIG.height;
    const tex = scene.textures.createCanvas(key, W, H);
    if (!tex) return;
    const ctx = tex.getContext();
    const grd = ctx.createRadialGradient(W / 2, H / 2, H * 0.30, W / 2, H / 2, H * 0.86);
    grd.addColorStop(0, 'rgba(' + color + ',0)');
    grd.addColorStop(0.5, 'rgba(' + color + ',0.38)');
    grd.addColorStop(1, 'rgba(' + color + ',1)');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);
    tex.refresh();
  },

  makeLife(scene, key, color) {
    const S = 24;
    const g = scene.make.graphics({ x: 0, y: 0, add: false });
    g.fillStyle(0x101a24, 1);
    g.fillRoundedRect(1, 1, S - 2, S - 2, 7);
    g.fillStyle(color, 1);
    g.fillRoundedRect(4, 4, S - 8, S - 8, 5);
    g.generateTexture(key, S, S);
    g.destroy();
  },

  makePowerup(scene, key, color, symbol) {
    const S = 32, c = S / 2;
    const g = scene.make.graphics({ x: 0, y: 0, add: false });

    g.fillStyle(color, 0.25); g.fillCircle(c, c, 15);
    g.fillStyle(0x101a24, 1); g.fillCircle(c, c, 13);
    g.fillStyle(color, 1);    g.fillCircle(c, c, 11);
    g.fillStyle(0xffffff, 1);

    if (symbol === 'rapid') {
      g.fillTriangle(c - 5, c - 4, c - 5, c + 4, c - 1, c);
      g.fillTriangle(c + 1, c - 4, c + 1, c + 4, c + 5, c);
    } else if (symbol === 'triple') {
      g.fillRect(c - 5, c - 4, 10, 2);
      g.fillRect(c - 5, c - 1, 10, 2);
      g.fillRect(c - 5, c + 2, 10, 2);
    } else if (symbol === 'shield') {
      g.fillTriangle(c, c - 6, c - 5, c, c + 5, c);
      g.fillTriangle(c, c + 6, c - 5, c, c + 5, c);
    } else {
      g.fillTriangle(c, c - 6, c - 4, c, c + 4, c);
      g.fillTriangle(c, c + 6, c - 4, c, c + 4, c);
      g.fillTriangle(c - 6, c, c, c - 4, c, c + 4);
      g.fillTriangle(c + 6, c, c, c - 4, c, c + 4);
    }

    g.generateTexture(key, S, S);
    g.destroy();
  },
};

/* ============================================================================
   UI —— 通用按钮
   ============================================================================ */
const UI = {
  FONT: '-apple-system, "PingFang SC", "Microsoft YaHei", sans-serif',
  MONO: '"Lucida Console", "Courier New", monospace',

  makeButton(scene, x, y, w, h, label, fillColor, hoverColor, onClick, fontSize) {
    const container = scene.add.container(x, y);
    const g = scene.add.graphics();
    const draw = (fill, hovered) => {
      g.clear();
      g.fillStyle(0x000000, 0.35);
      g.fillRoundedRect(-w/2 + 3, -h/2 + 5, w, h, 14);
      g.fillStyle(fill, 1);
      g.fillRoundedRect(-w/2, -h/2, w, h, 14);
      g.fillStyle(0xffffff, hovered ? 0.28 : 0.16);
      g.fillRoundedRect(-w/2 + 4, -h/2 + 4, w - 8, Math.max(6, h/2 - 10), 10);
      g.lineStyle(2.5, 0xffffff, 0.55);
      g.strokeRoundedRect(-w/2, -h/2, w, h, 14);
    };
    draw(fillColor, false);
    container.add(g);

    // fontSize 可选：小卡片上的按钮要塞进 116×34 的格子里，22px 会溢出来
    const text = scene.add.text(0, 0, label, {
      fontFamily: this.FONT, fontSize: fontSize || '22px', color: '#ffffff', fontStyle: 'bold',
    }).setOrigin(0.5);
    text.setShadow(0, 2, '#000000', 4, true, true);
    container.add(text);

    const hit = scene.add.rectangle(0, 0, w, h, 0x000000, 0);
    hit.setInteractive({ useHandCursor: true });
    hit.on('pointerover', () => draw(hoverColor, true));
    hit.on('pointerout',  () => draw(fillColor, false));
    hit.on('pointerdown', () => { SoundSys.unlock(); SoundSys.uiClick(); onClick(); });
    container.add(hit);

    return container;
  },
};

/* ============================================================================
   角色立绘 —— 菜单 / 商城 / 整备三处都要摆角色，统一收在这里
   ----------------------------------------------------------------------------
   程序化角色有 player-<key>-<dir> 这张单帧纹理可以直接用；
   图集角色（巫女）没有它，得取图集的第 0 帧（正好是下方向站姿）。
   缩放也必须分开算：图集帧里角色本体只占 16 px 宽，程序化帧里是 34 px，
   不按 portraitScale 补一次，巫女在界面上会小成一粒芝麻。
   ============================================================================ */
const CharArt = {
  /* 图集没加载成功（丢文件 / 离线）时整体退回程序化角色。
     键名、帧号、缩放三样必须一起换 —— 只换其中一样会得到
     "程序化纹理配图集缩放"这种半降级状态，角色会小得看不见 */
  resolve(scene, ch) {
    // 图集 key 走 charRunSheet：勇者的跑步图集叫 wari-walk，
    // 直接拼 '<sheet>-run' 会拿到不存在的 key，角色在界面上会退回程序化圆球
    const runSheet = ch.sheet ? charRunSheet(ch) : null;
    const ok = !!runSheet && scene.textures.exists(runSheet);
    if (ok) {
      return {
        key: runSheet,
        frame: 0,
        base: ch.portraitScale != null ? ch.portraitScale : 1.3,
      };
    }
    return { key: 'player-' + ch.key + '-down', frame: undefined, base: 1.3 };
  },
  /* scale 传的是"程序化角色摆在这个位置该用多大"（菜单 1.3 / 商城卡片 0.92 /
     整备轮盘 1.8），调用方按原来的习惯写就行。
     图集角色再按 base / 1.3 的比例自动放大一次 —— 图集帧里角色本体只占 16 px 宽，
     程序化帧里是 34 px，不补这一下巫女在界面上会小成一粒芝麻 */
  fit(scene, ch, scale) {
    const r = this.resolve(scene, ch);
    return (scale != null ? scale : 1.3) * (r.base / 1.3);
  },
  add(scene, x, y, ch, scale) {
    const r = this.resolve(scene, ch);
    const img = scene.add.image(x, y, r.key, r.frame);
    img.setScale(this.fit(scene, ch, scale));
    return img;
  },
};
