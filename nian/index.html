<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover 让画布能铺到刘海屏的圆角里；safe-area 由下面的 CSS 处理 -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="棋盘枪手 —— 斜俯视四方向自动射击小游戏">
<title>棋盘枪手 · Board Shooter</title>
<!-- 提前和 CDN 建连：phaser.min.js 是首屏最大的一块，握手能省一个 RTT -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-root"></div>
<div id="boot-splash">
  <div class="ring"></div>
  <div class="txt" id="boot-text">正在加载引擎…</div>
</div>
<div id="rotate-hint">
  <div class="phone"></div>
  <div>
    <div class="t1">请把手机横过来</div>
    <div class="t2">棋盘枪手是横屏游戏<br>竖着拿会被压成中间一条</div>
  </div>
  <button id="rotate-skip" type="button">就这样玩</button>
</div>
<script>
/* ============================================================================
   视口适配 —— 专治 iPhone 横屏"开局上下都被挡住"
   ----------------------------------------------------------------------------
   问题：横屏时 iOS Safari / 微信内置浏览器的 100dvh 会把**被顶部标签栏和
   底部工具栏盖住的那一截**也算进去，于是 Phaser 按这个偏大的高度做 FIT 缩放，
   画布就比真正能看见的区域高一截 —— 上面切掉标题、下面切掉按钮。

   做法：不信任 dvh，改用 visualViewport 报的"真正可见尺寸"，
   再扣掉刘海 / 小白条的安全区，把结果用行内像素尺寸写到 #game-root 上，
   最后让 Phaser 的 ScaleManager 按新尺寸重做一次 FIT。
   这样无论工具栏显示还是隐藏，整个 960×640 画面都完整可见（两侧留黑边）。
   ============================================================================ */
(function () {
  var root = document.getElementById('game-root');
  if (!root) return;

  function inset(name) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name);
    var n = parseFloat(v);
    return isNaN(n) ? 0 : n;
  }

  function fitViewport() {
    var vv = window.visualViewport;
    var w = Math.round((vv && vv.width) || window.innerWidth || 0);
    var h = Math.round((vv && vv.height) || window.innerHeight || 0);
    // 两个来源取小值：visualViewport 在个别 WebView 上偏大，innerHeight 在
    // 另一些场景下偏大。取小最坏也只是多留一点黑边，绝不会切掉画面。
    h = Math.min(h, Math.round(window.innerHeight || h));
    w = Math.min(w, Math.round(window.innerWidth || w));

    var top = inset('--sat'), bottom = inset('--sab');
    var left = inset('--sal'), right = inset('--sar');

    var availW = Math.max(200, w - left - right);
    var availH = Math.max(140, h - top - bottom);

    // 用 position:fixed + 像素值，彻底绕开 dvh / 百分比高度带来的误差
    root.style.position = 'fixed';
    root.style.top = top + 'px';
    root.style.left = left + 'px';
    root.style.width = availW + 'px';
    root.style.height = availH + 'px';

    // 把同一套"真正可见"的尺寸同步给 CSS 变量。
    // 启动页 / 竖屏提示用的是 inset:0，那是**布局视口** —— 真机上会一直铺到
    // 浏览器工具栏底下，居中内容看着就偏了。让它们改用这份变量对齐可见区。
    var rs = document.documentElement.style;
    rs.setProperty('--app-t', top + 'px');
    rs.setProperty('--app-l', left + 'px');
    rs.setProperty('--app-w', availW + 'px');
    rs.setProperty('--app-h', availH + 'px');

    // 让 Phaser 按新尺寸重做一次 FIT 缩放。
    // ★ 顺序有讲究：Phaser 的 refresh() 内部是「先 updateScale()（用缓存的
    //   parentSize 算缩放）→ 最后才 getParentBounds()（去重新量父容器）」。
    //   所以父容器刚被改小时单调一次 refresh()，算出来的是**旧尺寸**，
    //   画布不会缩，反而被 CENTER_BOTH 居中后上下各溢出半个差值 ——
    //   这正是「开局上下被挡住」的直接原因。必须显式先重测、再刷新。
    var g = window.game || window.__game;
    if (g && g.scale) {
      try {
        if (typeof g.scale.getParentBounds === 'function') g.scale.getParentBounds();
        if (typeof g.scale.refresh === 'function') g.scale.refresh();
      } catch (e) { /* 引擎还没起来就算了，10-main.js 里还会再调一次 */ }
    }
  }

  var timer = null;
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(fitViewport, 60);
  }

  // 暴露给 10-main.js：游戏实例创建之后再调一次，确保 ScaleManager 拿到最终尺寸
  window.__fitViewport = fitViewport;
  window.addEventListener('resize', schedule);
  window.addEventListener('orientationchange', function () {
    // 转屏后浏览器要过一会儿才把新尺寸报上来，多量两次
    setTimeout(fitViewport, 120);
    setTimeout(fitViewport, 400);
  });
  if (window.visualViewport) {
    // 地址栏 / 工具栏伸缩时 visualViewport 变化最灵敏，比 resize 更早拿到新尺寸
    window.visualViewport.addEventListener('resize', schedule);
    window.visualViewport.addEventListener('scroll', schedule);
  }
  fitViewport();
})();
</script>
<script>
/* 竖屏提示 / 启动页的开关。这段刻意不依赖 Phaser ——
   引擎还没下载完的时候玩家就该看到"请横屏"，而不是先黑屏再横屏 */
(function () {
  var hint = document.getElementById('rotate-hint');
  var skipBtn = document.getElementById('rotate-skip');
  var skipped = false;

  // 只在"竖屏 + 触摸设备"时提示。桌面上把窗口拉窄不该弹这个
  function portrait() {
    try {
      return window.matchMedia('(orientation: portrait) and (pointer: coarse)').matches;
    } catch (e) {
      return false;
    }
  }
  function apply() {
    var need = portrait() && !skipped;
    document.body.classList.toggle('need-rotate', need);
    if (need) {
      // 转屏期间玩家看不见画面，不暂停的话回来已经死了
      try {
        if (window.__game && window.__game.events) {
          window.__game.events.emit('blur');
        }
      } catch (e) { /* 引擎还没起来就算了 */ }
    }
  }
  skipBtn.addEventListener('click', function () { skipped = true; apply(); });
  window.addEventListener('resize', apply);
  window.addEventListener('orientationchange', function () { setTimeout(apply, 120); });
  apply();
  window.__applyRotateHint = apply;
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<!-- 主脚本：拆成 src/ 下 10 个文件，按序号顺序加载。
     顺序不能调换 —— 顶层全是 const / class，有 TDZ，顺序错了直接 ReferenceError。
     用经典 script 标签而不是 ES module：file:// 下 module 会被 CORS 拦，那样就不能双击直接玩了。 -->
<script src="src/01-boot.js"></script>
<script src="src/02-config.js"></script>
<script src="src/03-atlas.js"></script>
<script src="src/04-data.js"></script>
<script src="src/05-core.js"></script>
<script src="src/06-art.js"></script>
<script src="src/07-guide.js"></script>
<script src="src/08-menu.js"></script>
<script src="src/09-game.js"></script>
<script src="src/10-main.js"></script>
</body>
</html>
